        (variant.example && variant.example.japanese
          ? '<div class="example"><div class="example-row"><span class="ex-tag">例</span><div class="example-jp jp" lang="ja">' + esc(variant.example.japanese) + '</div>' + speakBtn(variant.example.japanese) + '</div>' +
            (variant.example.english ? '<div class="example-en">' + esc(variant.example.english) + '</div>' : '') + '</div>'
          : '') +
      '</div>';
    });

    return '<article class="card pattern-card">' +
      '<div class="pattern-meta">' +
        '<span class="badge ' + type.tone + '">' + esc(type.label) + '</span>' +
        '<span class="cat">' + esc(e.category) + '</span>' +
        '<span class="cat" style="margin-left:auto;display:inline-flex;align-items:center;gap:6px">' + statusDot(st) + statusLabel(st) + '</span>' +
      '</div>' +
      '<div class="pattern-name">' + esc(e.name) + '</div>' +
      '<div class="pattern-line jp" lang="ja">' + esc(e.pattern) + '</div>' +
      '<div class="pattern-english">' + esc(e.english_template) + '</div>' +
      '<div class="formation"><b>How it works</b>' + esc(e.formation) + '</div>' +
      body +
      (e.notes ? '<div class="note"><b>Note</b><span>' + esc(e.notes) + '</span></div>' : '') +
      sourcesHtml(e.sources) +
    '</article>';
  }

  function structureResultsHtml() {
    var list = getFilteredStructures();
    if (!list.length) {
      return '<div class="empty"><div class="big">文法</div><p>No patterns match those filters.</p><button class="btn btn-outline btn-sm" data-action="clear-browse" data-deck="grammar">Clear filters</button></div>';
    }
    return list.map(structureCard).join('');
  }

  function grammarView() {
    var stats = deckStats('structures');
    var categories = [];
    state.items.structures.forEach(function (item) {
      var c = item.entry.category;
      if (c && categories.indexOf(c) === -1) categories.push(c);
    });
    var types = [];
    state.items.structures.forEach(function (item) {
      var t = item.entry.structure_type;
      if (t && types.indexOf(t) === -1) types.push(t);
    });

    return '<div class="page-head">' +
      '<div><div class="eyebrow">文法 · Grammar</div><h1>Grammar patterns</h1><p>' +
        stats.total + ' sentence patterns, question patterns and verb formations from your notes, with examples and how each one is built.</p></div>' +
      headStats([[stats.total, 'Patterns'], [stats.mastered, 'Strong'], [stats.due, 'Due']]) +
    '</div>' +
    '<div class="toolbar">' +
      '<label class="search">' + ICON.search +
        '<input id="struct-search" type="search" placeholder="Search patterns, meanings or examples…" value="' + esc(state.ui.structQuery) + '" autocomplete="off" aria-label="Search grammar patterns">' +
      '</label>' +
      '<select class="control" id="struct-cat" aria-label="Filter by category">' +
        '<option value="all">All categories</option>' +
        categories.map(function (c) {
          return '<option value="' + esc(c) + '"' + (state.ui.structCat === c ? ' selected' : '') + '>' + esc(c) + '</option>';
        }).join('') +
      '</select>' +
      '<select class="control" id="struct-type" aria-label="Filter by pattern type">' +
        '<option value="all">All types</option>' +
        types.map(function (t) {
          var meta = TYPE_META[t] || { label: t };
          return '<option value="' + esc(t) + '"' + (state.ui.structType === t ? ' selected' : '') + '>' + esc(meta.label) + '</option>';
        }).join('') +
      '</select>' +
    '</div>' +
    '<div class="results-meta"><span id="struct-count">' + structCountHtml() + '</span></div>' +
    '<div class="pattern-list" id="struct-results">' + structureResultsHtml() + '</div>';
  }

  /* ------------------------------------------------------------------ *
   *  Study setup
   * ------------------------------------------------------------------ */

  function segButton(group, value, label, sub, active) {
    return '<button type="button" class="seg-btn' + (active ? ' active' : '') + '" data-action="setup" data-key="' + group + '" data-value="' + value + '">' +
      label + (sub ? '<small>' + sub + '</small>' : '') + '</button>';
  }

  function studyAside() {
    var due = ['vocab', 'kanji', 'structures'].map(function (deck) {
      var stats = deckStats(deck);
      return '<li><span>' + DECK_META[deck].name + '</span><b>' + stats.due + ' due</b></li>';
    }).join('');
    return '<aside class="card study-aside">' +
      '<h3>Smart review</h3>' +
      '<p>Cards you get right move up a level and return after 1, 2, 4 then 7 days. Miss one and it comes back tomorrow. New cards fill any session that is not yet full.</p>' +
      '<ul class="due-list">' + due + '</ul>' +
      '<p class="kbd-hint"><kbd>1</kbd>–<kbd>4</kbd> choose an answer · <kbd>Enter</kbd> next<br><kbd>Space</kbd> flip a card · <kbd>←</kbd><kbd>→</kbd> grade</p>' +
    '</aside>';
  }

  function studyView() {
    var s = state.session;
    if (s) {
      if (s.finished) return '<div class="session">' + resultsView(s) + '</div>';
      return '<div class="session">' + sessionHeader(s) + (s.mode === 'quiz' ? quizView(s) : flashView(s)) + '</div>';
    }

    var setup = state.setup;
    var deckCounts = {
      vocab: state.items.vocab.length,
      kanji: state.items.kanji.length,
      structures: state.items.structures.length,
      mixed: state.items.vocab.length + state.items.kanji.length + state.items.structures.length
    };
    var available = previewCount(setup.deck, setup.scope);
    var actual = setup.count === 'all' ? available : Math.min(Number(setup.count), available);

    return '<div class="page-head">' +
      '<div><div class="eyebrow">Study · 勉強</div><h1>Study session</h1><p>Pick a deck, a mode and how many cards you want. Smart review starts with whatever is due.</p></div>' +
    '</div>' +
    '<div class="setup-grid">' +
      '<div class="card setup-card">' +
        '<div class="field">' +
          '<div class="field-label"><span>Deck</span><em>' + deckCounts[setup.deck] + ' cards</em></div>' +
          '<div class="seg">' +
            segButton('deck', 'vocab', 'Vocabulary', '単語 · ' + deckCounts.vocab, setup.deck === 'vocab') +
            segButton('deck', 'kanji', 'Kanji', '漢字 · ' + deckCounts.kanji, setup.deck === 'kanji') +
            segButton('deck', 'structures', 'Grammar', '文法 · ' + deckCounts.structures, setup.deck === 'structures') +
            segButton('deck', 'mixed', 'Everything', 'Mixed · ' + deckCounts.mixed, setup.deck === 'mixed') +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<div class="field-label"><span>Mode</span></div>' +
          '<div class="seg">' +
            segButton('mode', 'quiz', 'Multiple choice', 'Choose 1 of 4', setup.mode === 'quiz') +
            segButton('mode', 'flash', 'Flashcards', 'Reveal and self-grade', setup.mode === 'flash') +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<div class="field-label"><span>What to study</span><em>' + available + ' cards available</em></div>' +
          '<div class="seg">' +
            segButton('scope', 'smart', 'Smart review', 'Due + new', setup.scope === 'smart') +
            segButton('scope', 'new', 'New cards', 'Never seen', setup.scope === 'new') +
            segButton('scope', 'tricky', 'Tricky', 'Often missed', setup.scope === 'tricky') +
            segButton('scope', 'all', 'All cards', 'Anything', setup.scope === 'all') +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<div class="field-label"><span>Session length</span></div>' +
          '<div class="seg">' +
            segButton('count', '10', '10', '', setup.count === 10) +
            segButton('count', '20', '20', '', setup.count === 20) +
            segButton('count', '30', '30', '', setup.count === 30) +
            segButton('count', 'all', 'All', '', setup.count === 'all') +
          '</div>' +
        '</div>' +
        (setup.deck === 'vocab' || setup.deck === 'mixed'
          ? '<div class="field">' +
              '<div class="field-label"><span>Prompt side</span></div>' +
              '<div class="seg">' +
                segButton('direction', 'en2jp', 'English → 日本語', '', setup.direction === 'en2jp') +
                segButton('direction', 'jp2en', '日本語 → English', '', setup.direction === 'jp2en') +
                segButton('direction', 'mixed', 'Both ways', 'Mixed', setup.direction === 'mixed') +
              '</div>' +
            '</div>'
          : '') +
        '<div class="setup-summary">' +
          '<b>' + actual + '</b><span>cards ready</span>' +
          '<span class="dot-sep"></span>' +
          '<span>' + (setup.mode === 'quiz' ? 'Multiple choice' : 'Flashcards') + ' · ' + deckLabel(setup.deck) + '</span>' +
          (available === 0 ? '<span class="dot-sep"></span><span>Try “All cards”</span>' : '') +
        '</div>' +
        '<button class="btn btn-primary btn-lg btn-block" data-action="start-study"' + (actual === 0 ? ' disabled' : '') + '>' +
          (setup.mode === 'quiz' ? 'Start quiz' : 'Start flashcards') + ' →' +
        '</button>' +
      '</div>' +
      studyAside() +
    '</div>';
  }

  function sessionHeader(s) {
    var total = s.mode === 'quiz' ? s.questions.length : s.items.length;
    var pos = s.mode === 'quiz' ? s.idx + 1 : s.index + 1;
    var pct = percent(pos, total);
    return '<div class="session-top">' +
      '<div class="session-title"><small>' + (s.mode === 'quiz' ? 'Quiz' : 'Flashcards') + '</small>' + esc(s.label) + '</div>' +
      '<div class="session-progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + pos + '"><span style="width:' + pct + '%"></span></div>' +
      '<span class="session-counter">' + pos + ' / ' + total + '</span>' +
      '<button class="btn btn-outline btn-sm" data-action="end-session">End</button>' +
    '</div>';
  }

  /* ------------------------------------------------------------------ *
   *  Quiz & flashcards
   * ------------------------------------------------------------------ */

  function quizView(s) {
    var q = s.questions[s.idx];
    var answered = s.answered;
    var isLast = s.idx >= s.questions.length - 1;
    var ok = answered !== null && answered === q.correctIndex;

    var optionsHtml = q.options.map(function (option, i) {
      var cls = 'option';
      if (answered !== null) {
        if (i === q.correctIndex) cls += ' correct';
        else if (i === answered) cls += ' wrong';
        else cls += ' dim';
      }
      if (q.optionKanji) cls += ' kanji';
      else if (hasJa(option)) cls += ' jp';
      if (String(option).length > 54) cls += ' long';
      return '<button type="button" class="' + cls + '" data-action="answer" data-index="' + i + '"' + (answered !== null ? ' disabled' : '') + '>' +
        '<span class="key">' + (i + 1) + '</span>' +
        '<span class="opt-text"' + (hasJa(option) ? ' lang="ja"' : '') + '>' + esc(option) + '</span>' +
      '</button>';
    }).join('');

    var feedback = '';
    if (answered !== null) {
      feedback = '<div class="feedback ' + (ok ? 'ok' : 'bad') + '" role="status">' +
        '<div class="feedback-head"><b>' + (ok ? '正解 · Correct' : 'おしい · Not quite') + '</b>' +
          (q.speech ? speakBtn(q.speech, 'Play pronunciation') : '') +
        '</div>' +
        '<div class="feedback-body">' + q.explainHtml + '</div>' +
        '<div class="feedback-foot">' +
          '<button class="btn btn-primary" data-action="next">' + (isLast ? 'See results' : 'Next question') + ' →</button>' +
        '</div>' +
      '</div>';
    }

    return '<div class="card quiz-card">' +
      '<div class="quiz-meta">' +
        '<span class="badge badge-indigo">' + esc(DECK_META[q.deck] ? DECK_META[q.deck].name : 'Study') + '</span>' +
        '<span class="muted" style="font-size:12px">' + esc(q.label) + '</span>' +
        '<span class="spacer"></span>' +
        '<span class="muted" style="font-size:11px">' + (q.deck === 'structures' ? 'Grammar pattern' : q.deck === 'kanji' ? 'Kanji' : 'Vocabulary') + '</span>' +
      '</div>' +
      '<div class="quiz-prompt' + (q.promptClass ? ' ' + q.promptClass : '') + (q.promptJa ? ' jp' : '') + '"' + (q.promptJa ? ' lang="ja"' : '') + '>' + esc(q.prompt) + '</div>' +
      (q.deck === 'kanji' ? '<div class="prompt-note">' + (q.label === 'Meaning · kanji' ? 'Which character matches this meaning?' : q.label === 'Kanji · on-yomi' ? 'Which is an on-yomi of this character?' : 'What does this kanji mean?') + '</div>' : '') +
      '<div class="options">' + optionsHtml + '</div>' +
      feedback +
      (answered === null ? '<p class="kbd-hint" style="text-align:center;margin-top:16px">Press <kbd>1</kbd>–<kbd>4</kbd> to answer</p>' : '') +
    '</div>';
  }

  function flashMain(text, isJa, small) {
    return '<div class="flash-main' + (isJa ? ' jp' : '') + (small ? ' small' : '') + '"' + (isJa ? ' lang="ja"' : '') + '>' + esc(text) + '</div>';
  }

  function flashFaces(item, direction) {
    if (item.deck === 'vocab') {
      var frontJa = direction === 'jp2en';
      return {
        front: '<div class="flash-label">' + (frontJa ? '日本語' : 'English') + '</div>' +
          flashMain(frontJa ? item.jp : item.en, frontJa),
        back: '<div class="flash-label">' + (frontJa ? 'English' : '日本語') + '</div>' +
          flashMain(frontJa ? item.en : item.jp, !frontJa) +
          '<div class="flash-sub">' + esc(item.en) + ' · Vocabulary</div>' +
          speakBtn(item.jp)
      };
    }

    if (item.deck === 'kanji') {
      return {
        front: '<div class="flash-label">Kanji</div>' +
          '<div class="flash-main jp" lang="ja" style="font-family:var(--serif);font-size:90px;line-height:1.1">' + esc(item.kanji) + '</div>',
        back: '<div class="flash-label">Meaning</div>' +
          flashMain(item.meanings.join(' / '), false, true) +
          '<div class="flash-sub">On: ' + esc(item.on.join('・') || '—') + '<br>Kun: ' + esc(item.kun.join('・') || '—') + '</div>' +
          speakBtn(item.kanji)
      };
    }

    var e = item.entry;
    var ex = e.example;
    return {
      front: '<div class="flash-label">' + esc(e.category) + '</div>' +
        flashMain(e.english_template, false, true) +
        '<div class="flash-sub">' + esc(e.name) + '</div>',
      back: '<div class="flash-label">Pattern</div>' +
        flashMain(e.pattern, hasJa(e.pattern), true) +
        '<div class="flash-sub">' + esc(e.formation) + '</div>' +
        (ex && ex.japanese ? '<div class="flash-details jp" lang="ja">' + esc(ex.japanese) + ' — ' + esc(ex.english) + '</div>' : '')
    };
  }

  function flashView(s) {
    var item = s.items[s.index];
    var faces = flashFaces(item, s.config.direction);
    var total = s.items.length;
    var pos = s.index + 1;
    return '<div class="flashcard' + (s.flipped ? ' flipped' : '') + '" role="button" tabindex="0" data-action="flip" aria-pressed="' + s.flipped + '" aria-label="Flashcard ' + pos + ' of ' + total + '. ' + (s.flipped ? 'Answer showing. Tap to flip back.' : 'Tap to reveal the answer.') + '">' +
      '<div class="flash-inner">' +
        '<div class="flash-face front">' + faces.front + '<span class="flash-hint">Tap to reveal</span></div>' +
        '<div class="flash-face back">' + faces.back + '<span class="flash-hint">Tap to flip back</span></div>' +
      '</div>' +
    '</div>' +
    '<div class="flash-controls">' +
      '<button type="button" class="btn btn-outline" data-action="grade" data-grade="0"' + (s.flipped ? '' : ' disabled') + '>Again <span class="muted">←</span></button>' +
      '<button type="button" class="btn btn-primary" data-action="grade" data-grade="1"' + (s.flipped ? '' : ' disabled') + '>Got it <span>→</span></button>' +
    '</div>' +
    '<p class="kbd-hint" style="text-align:center">' + (s.flipped ? 'How did you do? Grade yourself to continue.' : 'Tap the card or press <kbd>Space</kbd> to reveal the answer.') + '</p>';
  }

  /* ------------------------------------------------------------------ *
   *  Results
   * ------------------------------------------------------------------ */

  function itemSummary(item) {
    if (!item) return '';
    if (item.deck === 'vocab') {
      return '<span class="jp" lang="ja">' + esc(item.jp) + '</span> <span class="en">' + esc(item.en) + '</span>';
    }
    if (item.deck === 'kanji') {
      return '<span class="jp serif" lang="ja">' + esc(item.kanji) + '</span> <span class="en">' + esc(item.meanings.join(' / ')) + '</span>';
    }
    return '<span class="jp" lang="ja">' + esc(item.entry.pattern) + '</span> <span class="en">' + esc(item.entry.english_template) + '</span>';
  }

  function resultsView(s) {
    var total = s.results.length;
    var correct = s.correctCount;
    var pct = total ? percent(correct, total) : 0;
    var missed = s.results.filter(function (r) { return !r.correct; });
    var title = pct >= 90 ? 'すばらしい · Outstanding!' :
      pct >= 70 ? 'よくできました · Nice work' :
      pct >= 50 ? 'いいちょうし · Good progress' :
      'がんばって · Keep going';

    var missedHtml = missed.length
      ? '<div class="missed"><h3>Worth another look</h3><div class="missed-list">' +
          missed.map(function (r) {
            var speakText = r.item && r.item.deck === 'vocab' ? r.item.jp : r.item && r.item.deck === 'kanji' ? r.item.kanji : '';
            return '<div class="missed-row">' + itemSummary(r.item) +
              '<span class="spacer"></span>' + (speakText ? speakBtn(speakText) : '') + '</div>';
          }).join('') +
        '</div></div>'
      : '<div class="missed" style="text-align:center"><p class="muted" style="font-size:13px">Perfect run — every card answered correctly.</p></div>';

    return '<div class="card results">' +
      '<div class="score-ring" style="--pct:' + pct + '"><span>' + pct + '%</span></div>' +
      '<h2>' + title + '</h2>' +
      '<p class="results-sub">' + (s.mode === 'quiz' ? 'Quiz complete' : 'Flashcard session complete') + ' · ' + esc(s.label) + '</p>' +
      '<div class="result-stats">' +
        '<div class="result-stat"><b>' + correct + '</b><span>Correct</span></div>' +
        '<div class="result-stat"><b>' + (total - correct) + '</b><span>Missed</span></div>' +
        '<div class="result-stat"><b>' + total + '</b><span>Cards</span></div>' +
      '</div>' +
      '<div class="result-actions">' +
        (missed.length ? '<button class="btn btn-primary" data-action="review-missed">Review ' + missed.length + ' missed</button>' : '') +
        '<button class="btn btn-outline" data-action="restart-session">Study again</button>' +
        '<button class="btn btn-outline" data-action="end-session">Done</button>' +
      '</div>' +
      missedHtml +
    '</div>';
  }

  /* ------------------------------------------------------------------ *
   *  Routing & top-level render
   * ------------------------------------------------------------------ */

  function currentRoute() {
    var r = location.hash.replace(/^#\/?/, '');
    return ROUTES.indexOf(r) !== -1 ? r : 'home';
  }

  function render() {
    var view = $('#view');

    if (state.error) {
      view.innerHTML = errorView(state.error);
      updateNav('home');
      return;
    }
    if (!state.loaded) return;

    var route = currentRoute();
    state.route = route;

    var html = '';
    if (route === 'home') html = homeView();
    else if (route === 'vocab') html = vocabView();
    else if (route === 'kanji') html = kanjiView();
    else if (route === 'grammar') html = grammarView();
    else html = studyView();

    view.innerHTML = html;
    updateNav(route);
    updateHeader();
    updateStorageNote();

    var titles = {
      home: 'Year 8 Japanese · Study companion',
      vocab: 'Vocabulary · Year 8 Japanese',
      kanji: 'Kanji · Year 8 Japanese',
      grammar: 'Grammar · Year 8 Japanese',
      study: 'Study · Year 8 Japanese'
    };
    document.title = titles[route] || titles.home;
  }

  function updateNav(route) {
    $all('[data-nav]').forEach(function (link) {
      var active = link.dataset.nav === route;
      link.classList.toggle('active', active);
      if (active) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
  }

  function errorView(err) {
    var fileHint = location.protocol === 'file:'
      ? '<p style="margin-top:12px">This page is open as a local file. Browsers block <code>fetch()</code> for <code>file://</code> pages. Serve the folder instead, for example:<br><code>python3 -m http.server</code> then open <code>http://localhost:8000</code>.</p>'
      : '<p style="margin-top:12px">Make sure <code>vocab.json</code>, <code>kanji.json</code> and <code>structures.json</code> sit next to <code>index.html</code> on your host.</p>';
    return '<div class="card error-card">' +
      '<div class="eyebrow">Something went wrong</div>' +
      '<h2>Could not load the study data</h2>' +
      '<p>The page fetches the three JSON files that sit beside it. ' + esc(err && err.message ? err.message : 'The request failed.') + '</p>' +
      fileHint +
      '<button class="btn btn-primary" data-action="retry">Try again</button>' +
    '</div>';
  }

  /* ------------------------------------------------------------------ *
   *  Speech, toasts, misc actions
   * ------------------------------------------------------------------ */

  function cleanSpeech(text) {
    return String(text || '')
      .replace(/[（(][^）)]*[）)]/g, '')
      .split(' / ')[0]
      .replace(/[／/]/g, '')
      .trim();
  }

  function speak(text) {
    var clean = cleanSpeech(text);
    if (!clean) return;
    if (!('speechSynthesis' in window)) {
      toast('Speech is not supported in this browser.');
      return;
    }
    try {
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'ja-JP';
      utter.rate = 0.88;
      var voices = window.speechSynthesis.getVoices() || [];
      var jaVoice = voices.filter(function (v) { return /^ja/i.test(v.lang); })[0];
      if (jaVoice) utter.voice = jaVoice;
      window.speechSynthesis.speak(utter);
    } catch (e) {
      toast('Could not play the pronunciation.');
    }
  }

  function toast(message) {
    var host = $('#toasts');
    if (!host) return;
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = message;
    host.appendChild(el);
    setTimeout(function () {
      el.style.opacity = '0';
      el.style.transition = 'opacity .25s';
      setTimeout(function () { el.remove(); }, 260);
    }, 2400);
  }

  function resetProgress() {
    if (!window.confirm('Reset all study progress? This clears mastery, review history and streaks, but keeps your theme.')) return;
    state.progress = {};
    state.activity = {};
    saveStore();
    updateHeader();
    render();
    toast('Progress reset.');
  }

  function clearBrowse(deck) {
    if (deck === 'vocab') {
      state.ui.vocabQuery = '';
    } else if (deck === 'kanji') {
      state.ui.kanjiQuery = '';
      state.ui.kanjiFilter = 'all';
    } else {
      state.ui.structQuery = '';
      state.ui.structCat = 'all';
      state.ui.structType = 'all';
    }
    render();
  }

  function practiseFiltered() {
    var list = getFilteredVocab();
    if (!list.length) {
      toast('No words match your search.');
      return;
    }
    var capped = shuffle(list).slice(0, 30);
    if (list.length > 30) toast('Studying 30 of ' + list.length + ' matching words.');
    startSession({
      mode: 'flash',
      deck: 'vocab',
      direction: state.setup.direction,
      items: capped,
      label: 'Vocabulary practice'
    });
  }

  function refreshVocabResults() {
    var host = $('#vocab-results');
    if (!host) return;
    host.innerHTML = vocabResultsHtml();
    var count = $('#vocab-count');
    if (count) count.innerHTML = vocabCountHtml();
  }

  function refreshKanjiResults() {
    var host = $('#kanji-results');
    if (!host) return;
    host.innerHTML = kanjiResultsHtml();
    var count = $('#kanji-count');
    if (count) count.innerHTML = kanjiCountHtml();
  }

  function refreshStructResults() {
    var host = $('#struct-results');
    if (!host) return;
    host.innerHTML = structureResultsHtml();
    var count = $('#struct-count');
    if (count) count.innerHTML = structCountHtml();
  }

  /* ------------------------------------------------------------------ *
   *  Event listeners
   * ------------------------------------------------------------------ */

  function bindEvents() {
    document.addEventListener('click', function (event) {
      var el = event.target.closest('[data-action]');
      if (!el) return;
      var action = el.dataset.action;

      switch (action) {
        case 'noop':
          break;
        case 'theme':
          toggleTheme();
          break;
        case 'speak':
          event.preventDefault();
          event.stopPropagation();
          speak(el.dataset.speak);
          break;
        case 'start':
          startSession({
            mode: el.dataset.mode || 'quiz',
            deck: el.dataset.deck || state.setup.deck,
            scope: el.dataset.scope || 'smart',
            count: 10,
            direction: state.setup.direction
          });
          break;
        case 'quick-review':
          if (previewCount('mixed', 'smart') === 0) {
            toast('Nothing is due — try “All cards” in Study.');
          } else {
            startSession({ mode: 'quiz', deck: 'mixed', scope: 'smart', count: 10, direction: state.setup.direction });
          }
          break;
        case 'setup': {
          var key = el.dataset.key;
          var value = el.dataset.value;
          state.setup[key] = key === 'count' && value !== 'all' ? Number(value) : value;
          render();
          break;
        }
        case 'start-study': {
          var setup = state.setup;
          startSession({
            mode: setup.mode,
            deck: setup.deck,
            scope: setup.scope,
            count: setup.count,
            direction: setup.direction
          });
          break;
        }
        case 'answer':
          answerQuestion(Number(el.dataset.index));
          break;
        case 'next':
          nextQuestion();
          break;
        case 'flip':
          toggleFlash();
          break;
        case 'grade':
          gradeFlash(Number(el.dataset.grade));
          break;
        case 'end-session':
          endSession();
          break;
        case 'restart-session':
          restartSession();
          break;
        case 'review-missed':
          reviewMissed();
          break;
        case 'open-kanji':
          openKanji(el.dataset.id);
          break;
        case 'close-modal':
          closeModal();
          break;
        case 'practise-item': {
          var item = state.byId.get(el.dataset.id);
          if (item) {
            closeModal();
            startSession({ mode: 'flash', deck: item.deck, direction: state.setup.direction, items: [item], label: 'Kanji practice' });
          }
          break;
        }
        case 'kanji-filter':
          state.ui.kanjiFilter = el.dataset.value;
          render();
          break;
        case 'practise-filtered':
          practiseFiltered();
          break;
        case 'clear-browse':
          clearBrowse(el.dataset.deck);
          break;
        case 'reset':
          resetProgress();
          break;
        case 'retry':
          state.error = null;
          state.loaded = false;
          $('#view').innerHTML = '<div class="loading"><div class="spinner" aria-hidden="true"></div><h2>Loading your study desk…</h2><p>Fetching vocabulary, kanji and grammar patterns.</p></div>';
          loadData();
          break;
      }
    });

    document.addEventListener('input', function (event) {
      var target = event.target;
      if (target.id === 'vocab-search') {
        state.ui.vocabQuery = target.value;
        refreshVocabResults();
      } else if (target.id === 'kanji-search') {
        state.ui.kanjiQuery = target.value;
        refreshKanjiResults();
      } else if (target.id === 'struct-search') {
        state.ui.structQuery = target.value;
        refreshStructResults();
      }
    });

    document.addEventListener('change', function (event) {
      var target = event.target;
      if (target.id === 'vocab-sort') {
        state.ui.vocabSort = target.value;
        refreshVocabResults();
      } else if (target.id === 'struct-cat') {
        state.ui.structCat = target.value;
        refreshStructResults();
      } else if (target.id === 'struct-type') {
        state.ui.structType = target.value;
        refreshStructResults();
      }
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        if (state.modal) {
          closeModal();
          return;
        }
      }
      if (state.modal) return;
      if (currentRoute() !== 'study' || !state.session || state.session.finished) return;

      var target = event.target;
      var closest = target && typeof target.closest === 'function'
        ? function (selector) { return target.closest(selector); }
        : function () { return null; };
      if (closest('input, textarea, select')) return;

      var s = state.session;
      var onControl = !!closest('button, a');

      if (s.mode === 'quiz') {
        if (s.answered === null) {
          if (/^[1-4]$/.test(event.key)) {
            event.preventDefault();
            answerQuestion(Number(event.key) - 1);
          }
        } else if (event.key === 'Enter' && !onControl) {
          event.preventDefault();
          nextQuestion();
        }
      } else {
        if (event.key === ' ' || event.key === 'Spacebar') {
          if (!onControl) {
            event.preventDefault();
            toggleFlash();
          }
        } else if (event.key === 'Enter' && !onControl) {
          event.preventDefault();
          if (s.flipped) gradeFlash(1); else toggleFlash();
        } else if (event.key === 'ArrowRight' && s.flipped) {
          event.preventDefault();
          gradeFlash(1);
        } else if (event.key === 'ArrowLeft' && s.flipped) {
          event.preventDefault();
          gradeFlash(0);
        }
      }
    });

    window.addEventListener('hashchange', function () {
      if (state.modal) closeModal();
      var route = currentRoute();
      if (route !== state.route) window.scrollTo({ top: 0, behavior: 'auto' });
      render();
    });
  }

  /* ------------------------------------------------------------------ *
   *  Boot
   * ------------------------------------------------------------------ */

  loadStore();
  applyTheme();
  bindEvents();
  updateStorageNote();
  updateHeader();
  loadData();
})();

</script>
</body>
</html>
