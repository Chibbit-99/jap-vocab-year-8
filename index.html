<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="Year 8 Japanese study app: vocabulary, kanji, grammar and sentence practice." />
<meta name="theme-color" content="#fbfbf9" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%23191919%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-family=%22serif%22 font-size=%2234%22 fill=%22%23fbfbf9%22 text-anchor=%22middle%22%3E%E5%AD%A6%3C/text%3E%3C/svg%3E" />
<title>Year 8 Japanese</title>
<style>
  :root {
    --bg: #fbfbf9;
    --surface: #ffffff;
    --ink: #191919;
    --muted: #767672;
    --faint: #f2f2ee;
    --line: #e6e6e0;
    --line-strong: #cfcfc7;
    --accent: #191919;
    --green: #2f7d55;
    --red: #b3442e;
    --radius: 8px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, "Hiragino Sans", "Noto Sans JP", sans-serif;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
  }
  [data-theme="dark"] {
    --bg: #121212;
    --surface: #1a1a1a;
    --ink: #ededed;
    --muted: #8f8f8a;
    --faint: #212121;
    --line: #2b2b2b;
    --line-strong: #3d3d3d;
    --accent: #ededed;
    --green: #6fbf94;
    --red: #e08269;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15.5px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ink); color: var(--bg); }
  :focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  button, input, select { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  h1, h2, h3, p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }
  a { color: inherit; }
  [hidden] { display: none !important; }

  .shell { max-width: 820px; margin: 0 auto; padding: 0 22px 96px; }

  /* header */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .top-in {
    max-width: 820px; margin: 0 auto; padding: 0 22px;
    height: 52px; display: flex; align-items: center; gap: 22px;
  }
  .mark { font-family: var(--serif); font-size: 19px; text-decoration: none; line-height: 1; flex: none; }
  .nav { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a {
    font-size: 13.5px; color: var(--muted); text-decoration: none;
    padding: 4px 0; white-space: nowrap; border-bottom: 1px solid transparent;
  }
  .nav a:hover { color: var(--ink); }
  .nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
  .top-end { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .streak { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .icon-btn {
    display: inline-grid; place-items: center;
    width: 26px; height: 26px; padding: 0; flex: none;
    border: 0; border-radius: 4px; background: none; color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover { color: var(--ink); background: var(--faint); }
  .icon-btn svg { width: 15px; height: 15px; }
  .theme-toggle .moon { display: none; }
  [data-theme="dark"] .theme-toggle .sun { display: none; }
  [data-theme="dark"] .theme-toggle .moon { display: block; }

  /* typography */
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.25; }
  .lede { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .page { padding-top: 36px; }
  .page-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .count { font-size: 12px; color: var(--muted); }
  .hr { height: 1px; background: var(--line); border: 0; margin: 30px 0; }

  /* controls */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 13px; border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--surface); font-size: 13.5px; line-height: 1.3;
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-solid { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn-solid:hover:not(:disabled) { filter: opacity(.85); }
  .btn-quiet { border-color: transparent; background: none; color: var(--muted); padding: 6px 8px; }
  .btn-quiet:hover:not(:disabled) { color: var(--ink); background: var(--faint); border-color: transparent; }
  .btn-sm { padding: 6px 10px; font-size: 12.5px; }
  .btn-wide { width: 100%; padding: 11px 14px; }

  input[type="search"], select {
    padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); font-size: 13.5px; min-width: 0;
  }
  input[type="search"] { flex: 1; }
  input[type="search"]:focus, select:focus { outline: none; border-color: var(--ink); }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .bar-spacer { flex: 1; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip {
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px;
    background: none; font-size: 12.5px; color: var(--muted); cursor: pointer;
  }
  .chip:hover { border-color: var(--line-strong); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  /* lists */
  .rows { border-top: 1px solid var(--line); }
  .row {
    display: flex; align-items: baseline; gap: 14px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .row .en { flex: 1; min-width: 0; font-size: 14px; }
  .row .jp { font-size: 15.5px; white-space: nowrap; }
  .row .jp.wide { white-space: normal; text-align: right; max-width: 62%; }
  .row .meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .row .icon-btn { align-self: center; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); flex: none; align-self: center; }
  .dot.learning { background: #c19b46; }
  .dot.mastered { background: var(--green); }
  [data-theme="dark"] .dot.learning { background: #d3b062; }

  /* home */
  .home-title { font-size: clamp(28px, 5vw, 36px); font-weight: 600; letter-spacing: -.025em; margin: 4px 0 10px; }
  .home-sub { color: var(--muted); max-width: 46ch; }
  .home-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
  .quiet-list { border-top: 1px solid var(--line); margin-top: 40px; }
  .quiet-row {
    display: flex; align-items: baseline; gap: 14px;
    padding: 13px 0; border-bottom: 1px solid var(--line);
    text-decoration: none;
  }
  .quiet-row .label { flex: 1; font-size: 15px; }
  .quiet-row .n { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .quiet-row:hover .label { text-decoration: underline; text-underline-offset: 3px; }
  .stats-line { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 14px; }

  /* details (kanji) */
  .krow { border-bottom: 1px solid var(--line); }
  .krow > summary {
    display: flex; align-items: center; gap: 16px; padding: 10px 0;
    cursor: pointer; list-style: none;
  }
  .krow > summary::-webkit-details-marker { display: none; }
  .krow > summary:hover .kanji { opacity: .6; }
  .kanji { font-family: var(--serif); font-size: 26px; line-height: 1.1; width: 34px; flex: none; }
  .krow .mean { flex: 1; font-size: 14px; }
  .krow .read { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .kbody { padding: 4px 0 18px 50px; font-size: 13.5px; color: var(--muted); }
  .kbody dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0 0 10px; }
  .kbody dt { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
  .kbody dd { margin: 0; color: var(--ink); }
  .words { display: grid; gap: 3px; }
  .words span { display: block; }
  .words b { font-weight: 500; }
  .kbody .note { margin-top: 10px; padding-left: 10px; border-left: 2px solid var(--line); }
  .kbody .sources { margin-top: 10px; font-size: 12px; }
  .kbody .sources summary { cursor: pointer; }
  .kbody .sources li { margin: 2px 0; }

  /* grammar */
  .pattern { padding: 20px 0; border-bottom: 1px solid var(--line); }
  .pattern .cat { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .pattern .name { font-size: 14px; margin-top: 3px; }
  .pattern .jp-pattern { font-size: 19px; line-height: 1.5; margin-top: 8px; }
  .pattern .en-pattern { color: var(--muted); font-size: 13.5px; }
  .pattern .ex { margin-top: 10px; font-size: 14px; }
  .pattern .ex small { color: var(--muted); font-size: 12.5px; }
  .pattern details { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .pattern details summary { cursor: pointer; color: var(--ink); font-size: 12.5px; }
  .pattern details p { margin-top: 6px; }
  .pattern .variant { margin-top: 10px; padding-left: 12px; border-left: 2px solid var(--line); }
  .pattern .speak { margin-left: 6px; vertical-align: -3px; }

  /* study setup */
  .setup { display: grid; gap: 26px; max-width: 560px; }
  .field label { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    padding: 7px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--surface); font-size: 13px; cursor: pointer;
  }
  .seg button:hover { border-color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .start-note { font-size: 12.5px; color: var(--muted); }

  /* session */
  .session-top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .track { flex: 1; height: 2px; background: var(--line); }
  .track span { display: block; height: 100%; background: var(--ink); transition: width .25s ease; }
  .pos { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .quiz { padding: 8px 0 0; }
  .q-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .q-text { font-size: clamp(24px, 4vw, 30px); line-height: 1.35; letter-spacing: -.015em; margin: 10px 0 26px; }
  .q-text.jp { line-height: 1.45; letter-spacing: 0; }
  .q-text.small { font-size: clamp(18px, 2.8vw, 22px); }
  .q-text.glyph { font-family: var(--serif); font-size: clamp(52px, 9vw, 72px); margin-bottom: 22px; }

  .answers { display: grid; gap: 7px; }
  .answer {
    display: flex; align-items: baseline; gap: 12px;
    width: 100%; padding: 11px 13px; text-align: left;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); font-size: 14px; cursor: pointer; line-height: 1.45;
  }
  .answer:hover:not(:disabled) { border-color: var(--ink); }
  .answer:disabled { cursor: default; }
  .answer .k { font-size: 11px; color: var(--muted); min-width: 10px; }
  .answer .t { flex: 1; }
  .answer.jp .t { font-size: 16px; }
  .answer.kanji .t { font-family: var(--serif); font-size: 22px; }
  .answer.long .t { font-size: 13px; }
  .answer.ok { border-color: var(--green); }
  .answer.ok .k { color: var(--green); }
  .answer.no { border-color: var(--red); }
  .answer.no .k { color: var(--red); }
  .answer.dim { color: var(--muted); }

  .after { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .verdict { font-size: 14px; font-weight: 600; }
  .verdict .ja { font-family: var(--serif); font-weight: 400; }
  .verdict.ok { color: var(--green); }
  .verdict.no { color: var(--red); }
  .after .detail { margin-top: 5px; font-size: 13.5px; color: var(--muted); }
  .after .detail .jp { color: var(--ink); }
  .after .buttons { display: flex; gap: 8px; margin-top: 16px; }
  .shortcut { margin-top: 20px; font-size: 11.5px; color: var(--muted); text-align: center; }
  kbd {
    font-family: inherit; font-size: 10.5px; padding: 1px 5px;
    border: 1px solid var(--line); border-radius: 3px; color: var(--muted);
  }

  /* flashcards */
  .card-face {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; min-height: 260px; padding: 30px 20px; text-align: center;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    cursor: pointer; width: 100%;
  }
  .card-face:hover { border-color: var(--line-strong); }
  .card-label { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .card-big { font-size: clamp(24px, 4.2vw, 32px); line-height: 1.4; letter-spacing: -.01em; }
  .card-big.jp { letter-spacing: 0; }
  .card-big.glyph { font-family: var(--serif); font-size: 76px; line-height: 1.15; }
  .card-sub { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 46ch; }
  .card-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .card-actions .btn { padding: 12px; }

  /* results */
  .result { max-width: 480px; }
  .result .score { font-size: 56px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
  .result .score small { font-size: 15px; color: var(--muted); font-weight: 400; letter-spacing: 0; margin-left: 6px; }
  .result .muted { color: var(--muted); font-size: 13.5px; }
  .result .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
  .result h3 { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 30px 0 6px; font-weight: 600; }

  /* sentence mode */
  .sent-frame {
    font-size: clamp(21px, 3.4vw, 27px); line-height: 1.6;
    padding: 22px 0 4px;
  }
  .sent-frame .hl { border-bottom: 1.5px solid var(--ink); padding-bottom: 1px; }
  .sent-frame .fill {
    display: inline-block; min-width: 74px; border-bottom: 1.5px solid var(--ink);
    color: var(--muted); text-align: center;
  }
  .sent-en { color: var(--muted); font-size: 14px; margin-top: 10px; }
  .sent-source { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-top: 20px; }

  /* misc */
  .empty { padding: 40px 0; color: var(--muted); font-size: 14px; }
  .toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: grid; gap: 6px; width: min(90vw, 360px); }
  .toast { background: var(--ink); color: var(--bg); padding: 9px 13px; border-radius: var(--radius); font-size: 12.5px; text-align: center; }
  .foot { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: 60px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  .foot button { font-size: 11.5px; }
  .note-storage { font-size: 11.5px; color: var(--muted); }

  .load, .fail { padding: 60px 0; text-align: center; color: var(--muted); font-size: 14px; }
  .fail { text-align: left; max-width: 520px; }
  .fail h2 { font-size: 17px; color: var(--ink); font-weight: 600; margin-bottom: 8px; }
  .fail p { margin-bottom: 8px; }
  .fail code { font-size: 12.5px; background: var(--faint); padding: 1px 5px; border-radius: 3px; }

  @media (max-width: 620px) {
    .shell, .top-in { padding-left: 16px; padding-right: 16px; }
    .top-in { gap: 14px; }
    .nav { gap: 13px; }
    .nav a { font-size: 13px; }
    .streak { display: none; }
    .row { gap: 10px; }
    .row .en { font-size: 13.5px; }
    .row .jp { font-size: 14.5px; }
    .row .jp.wide { max-width: 56%; }
    .kbody { padding-left: 0; }
    .card-face { min-height: 220px; }
    .result .score { font-size: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="mark" href="#home" aria-label="Home">学</a>
    <nav class="nav" aria-label="Sections">
      <a href="#home" data-nav="home">Home</a>
      <a href="#vocab" data-nav="vocab">Vocab</a>
      <a href="#kanji" data-nav="kanji">Kanji</a>
      <a href="#grammar" data-nav="grammar">Grammar</a>
      <a href="#study" data-nav="study">Study</a>
    </nav>
    <div class="top-end">
      <span class="streak" id="streak" hidden></span>
      <button type="button" class="icon-btn theme-toggle" id="theme-toggle" data-action="theme" aria-label="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.2 8.2 0 1 1 9.5 4 6.6 6.6 0 0 0 20 14.5Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="shell" id="main">
  <div id="view"><p class="load">Loading…</p></div>
  <footer class="foot">
    <span class="note-storage" id="storage-note">Progress is stored in this browser</span>
    <button type="button" class="btn btn-quiet btn-sm" data-action="reset">Reset progress</button>
  </footer>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------- *
   *  Constants
   * ---------------------------------------------------------------- */

  var DAY = 86400000;
  var INTERVALS = { 1: 0, 2: 1, 3: 2, 4: 4, 5: 7 };
  var STORE_KEY = 'jp8-japanese-study-v1';
  var ROUTES = ['home', 'vocab', 'kanji', 'grammar', 'study'];
  var DECK_NAMES = { vocab: 'Vocabulary', kanji: 'Kanji', structures: 'Grammar', sentences: 'Sentences', mixed: 'Everything' };

  var ICON = {
    speak: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.2 9H3v6h3.2L11 19V5Z" fill="currentColor"/><path d="M15 8.7a4.6 4.6 0 0 1 0 6.6M17.7 5.9a8.4 8.4 0 0 1 0 12.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'
  };

  var state = {
    loaded: false,
    error: null,
    items: { vocab: [], kanji: [], structures: [] },
    byId: new Map(),
    byType: {},
    structuresById: {},
    progress: {},
    activity: {},
    settings: { theme: null },
    route: '',
    session: null,
    ui: { vocabQuery: '', kanjiQuery: '', structQuery: '' },
    setup: { mode: 'quiz', deck: 'vocab', scope: 'smart', count: 10, direction: 'mixed', group: 'all' }
  };

  var storageOK = true;

  /* ---------------------------------------------------------------- *
   *  Utilities
   * ---------------------------------------------------------------- */

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function hasJa(text) { return /[\u3040-\u30ff\u3400-\u9fff]/.test(String(text || '')); }
  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
  function percent(part, total) { return total ? Math.round((part / total) * 100) : 0; }
  function dateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // "（お）てら" -> "てら", "バスケ / バスケットボール" -> "バスケ"
  function primaryJp(text) {
    return String(text || '')
      .split(' / ')[0]
      .replace(/[（(][^）)]*[）)]/g, '')
      .replace(/\s+/g, '')
      .trim();
  }

  /* ---------------------------------------------------------------- *
   *  Storage, theme

  function loadStore() {
    try {
      var raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      if (raw.progress && typeof raw.progress === 'object') state.progress = raw.progress;
      if (raw.activity && typeof raw.activity === 'object') state.activity = raw.activity;
      if (raw.settings && typeof raw.settings === 'object') state.settings = Object.assign(state.settings, raw.settings);
    } catch (e) { /* ignore */ }
    try {
      localStorage.setItem('__t', '1');
      localStorage.removeItem('__t');
    } catch (e) { storageOK = false; }
  }

  function saveStore() {
    if (!storageOK) return;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        progress: state.progress, activity: state.activity, settings: state.settings
      }));
    } catch (e) { storageOK = false; }
  }

  function applyTheme() {
    var t = state.settings.theme;
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#121212' : '#fbfbf9');
  }

  /* ---------------------------------------------------------------- *
   *  Data
   * ---------------------------------------------------------------- */

  function loadData() {
    Promise.all(['vocab.json', 'kanji.json', 'structures.json'].map(function (file) {
      return fetch(file, { cache: 'no-cache' }).then(function (res) {
        if (!res.ok) throw new Error(file + ' (HTTP ' + res.status + ')');
        return res.json();
      });
    })).then(function (results) {
      if (!Array.isArray(results[0]) || !Array.isArray(results[1]) || !Array.isArray(results[2])) {
        throw new Error('One of the data files is not a JSON array.');
      }
      normalise(results[0], results[1], results[2]);
      state.loaded = true;
      render();
    }).catch(function (err) {
      state.error = err;
      render();
    });
  }

  function normalise(vocab, kanji, structures) {
    state.items.vocab = vocab.map(function (entry) {
      var keys = Object.keys(entry || {}).filter(function (k) { return k.charAt(0) !== '$'; });
      if (!keys.length) return null;
      var en = keys[0];
      var jp = entry[en];
      if (typeof jp !== 'string') return null;
      return {
        deck: 'vocab', id: 'v:' + en, en: en, jp: jp,
        type: entry.$type || null, nat: entry.$nat || null,
        play: entry.$play || null, num: typeof entry.$num === 'number' ? entry.$num : null
      };
    }).filter(Boolean);

    state.items.kanji = kanji.map(function (entry) {
      if (!entry || !entry.kanji) return null;
      var pron = entry.pronunciations || {};
      return {
        deck: 'kanji', id: 'k:' + entry.kanji, kanji: entry.kanji,
        meanings: entry.meanings || [],
        on: pron.on_yomi || [], kun: pron.kun_yomi || [],
        readings: pron.readings_in_content || [],
        entry: entry
      };
    }).filter(Boolean);

    state.items.structures = structures.map(function (entry) {
      if (!entry || !entry.id) return null;
      state.structuresById[entry.id] = entry;
      return { deck: 'structures', id: 's:' + entry.id, entry: entry };
    }).filter(Boolean);

    state.byId = new Map();
    state.byType = {};
    ['vocab', 'kanji', 'structures'].forEach(function (deck) {
      state.items[deck].forEach(function (item) { state.byId.set(item.id, item); });
    });
    state.items.vocab.forEach(function (item) {
      if (!item.type) return;
      (state.byType[item.type] = state.byType[item.type] || []).push(item);
    });

  function allItems(deck) {
    if (deck === 'mixed') return state.items.vocab.concat(state.items.kanji, state.items.structures);

  /* ---------------------------------------------------------------- *
   *  Progress
   * ---------------------------------------------------------------- */

  function isDue(item) {
    var p = state.progress[item.id];
    if (!p) return false;
    var gap = INTERVALS[p.b || 1];
    return Date.now() >= (p.t || 0) + (gap == null ? 0 : gap) * DAY;
  }

  function recordAnswer(id, correct) {
    var p = state.progress[id] || { b: 0, c: 0, w: 0, t: 0 };
    if (correct) {
      p.b = Math.min(5, (p.b || 0) + 1);
      p.c = (p.c || 0) + 1;
    } else {
      p.b = 1;
      p.w = (p.w || 0) + 1;
    }
    p.t = Date.now();
    state.progress[id] = p;
    var key = dateKey(new Date());
    state.activity[key] = (state.activity[key] || 0) + 1;
    saveStore();
    updateStreak();
  }

  function statsFor(deck) {
    var items = allItems(deck);
    var out = { total: items.length, mastered: 0, learning: 0, due: 0, correct: 0, wrong: 0 };
    items.forEach(function (item) {
      var p = state.progress[item.id];
      if (!p) return;
      out.correct += p.c || 0;
      out.wrong += p.w || 0;
      if ((p.b || 1) >= 4) out.mastered++; else out.learning++;
      if (isDue(item)) out.due++;
    });
    return out;
  }

  function streakCount() {
    var act = state.activity;
    var d = new Date();
    if (!act[dateKey(d)]) d.setDate(d.getDate() - 1);
    var n = 0;
    while (act[dateKey(d)] && n < 3650) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function updateStreak() {
    var el = $('#streak');
    if (!el) return;
    var n = streakCount();
    el.hidden = n === 0;
    el.textContent = n ? n + ' day' + (n === 1 ? '' : 's') + ' streak' : '';
  }

  /* ---------------------------------------------------------------- *
   *  Selection
   * ---------------------------------------------------------------- */

  function previewCount(deck, scope) {
    if (deck === 'sentences') return FRAMES.length;
    var pool = allItems(deck);
    if (scope === 'new') return pool.filter(function (it) { return !state.progress[it.id]; }).length;
    if (scope === 'tricky') {
      return pool.filter(function (it) {
        var p = state.progress[it.id];
        return p && ((p.w || 0) > (p.c || 0) || (p.b || 1) <= 1);
      }).length;
    }
    if (scope === 'smart') return pool.filter(function (it) { return !state.progress[it.id] || isDue(it); }).length;
    return pool.length;
  }

  function pickItems(deck, scope, count) {
    var pool = allItems(deck);
    var n = count === 'all' ? pool.length : Math.max(1, Number(count));
    if (scope === 'new') return shuffle(pool.filter(function (it) { return !state.progress[it.id]; })).slice(0, n);
    if (scope === 'tricky') {
      return shuffle(pool.filter(function (it) {
        var p = state.progress[it.id];
        return p && ((p.w || 0) > (p.c || 0) || (p.b || 1) <= 1);
      })).slice(0, n);
    }
    if (scope === 'smart') {
      var due = shuffle(pool.filter(isDue)).slice(0, n);
      var fresh = shuffle(pool.filter(function (it) { return !state.progress[it.id]; }));
      return due.concat(fresh.slice(0, Math.max(0, n - due.length)));
    }
    return shuffle(pool).slice(0, n);
  }

  function optionsFor(answer, poolValues, max) {
    max = max || 4;

    var candidates = shuffle(poolValues);
    for (var i = 0; i < candidates.length && out.length < max; i++) {
      var candidate = candidates[i];
      if (!candidate) continue;
      var key = candidate.trim().toLowerCase();
      if (seen[key]) continue;
      seen[key] = true;
      out.push(candidate);
    }
    return shuffle(out);
  }

  function fillFrame(template, values, blankSlot) {
    return template.replace(/\[([a-z]+)\]/g, function (token, name) {
      if (name === blankSlot) return '<span class="fill">＿＿</span>';
      var v = values[name];
      return v ? esc(v.jp) : token;
    });
  }

  var FALLBACK_POOLS = { day_rel: 'day', age: 'people', people: 'age', adj_i_food: 'adj:any:i:base' };

  function fallbackPool(poolName) {
    if (FALLBACK_POOLS[poolName]) return FALLBACK_POOLS[poolName];
    var adj = /^adj:(\w+):(\w+):(\w+)$/.exec(poolName);
    if (adj) return 'adj:any:' + adj[2] + ':' + adj[3];
    return null;
  }

  function framePool(group) {
    return FRAMES.filter(function (f) { return group === 'all' || f.group === group; });
  }

  function buildSentenceCard(used) {
    var frames = framePool(state.setup.group);
    var available = frames.filter(function (f) { return !used[f.id]; });
    if (!available.length) { available = frames; used = {}; }
    var frame = pick(available);
    used[frame.id] = true;

    var slots = frame.variants ? pick(frame.variants) : frame.slots;
    var values = {};
    var ok = true;
    Object.keys(slots).forEach(function (slotName) {
      var poolName = slots[slotName];
      var list = pool(poolName);
      if (!list.length) { ok = false; return; }
      values[slotName] = pick(list);
    });
    if (!ok) return null;

    if (frame.id === 'instrument') {
      values.pv = { jp: values.i.item.play || 'ひきます', en: '' };
    }
    if (frame.id === 'comparative' && values.a.item === values.b.item) {
      var other = pick(pool('item').filter(function (v) { return v.item !== values.a.item; }));
      if (other) values.b = other;
    }

    var target = values[frame.blank];
    var poolName = slots[frame.blank];
    var distractorPool = pool(poolName).map(function (v) { return v.jp; });
    var fallback = distractorPool.length < 5 ? fallbackPool(poolName) : null;
    if (fallback) {
      distractorPool = distractorPool.concat(pool(fallback).map(function (v) { return v.jp; }));
    }
    var distractors = optionsFor(target.jp, distractorPool);
    var jp = fillFrame(frame.jp, values, null);
    var prompt = fillFrame(frame.jp, values, frame.blank);
    var english = frame.en(values);

    return {
      kind: 'sentence',
      itemId: target.item ? target.item.id : null,
      label: 'Sentence · ' + META[frame.group].name,
      prompt: prompt,
      promptJa: true,
      promptClass: 'sentence',
      options: distractors,
      correctIndex: Math.max(0, distractors.indexOf(target.jp)),
      answer: jp,
      speech: jp.replace(/。/g, '。'),
      detailHtml: '<span class="jp">' + esc(jp) + '</span><br>' + esc(english) +
        '<br><small>' + esc(frameEn(frame.src)) + '</small>',
      englishHtml: esc(english) + '<br><small>' + esc(frameEn(frame.src)) + '</small>'
    };
  }

  /* ---------------------------------------------------------------- *
   *  Cards for the other decks
   * ---------------------------------------------------------------- */

  function vocabCard(item, direction) {
    var dir = direction === 'mixed' ? (Math.random() < 0.5 ? 'en2jp' : 'jp2en') : direction;
    var front = dir === 'en2jp' ? item.en : item.jp;
    var back = dir === 'en2jp' ? item.jp : item.en;
    var answer = dir === 'en2jp' ? item.jp : item.en;
    var optionPool = state.items.vocab.filter(function (x) { return x.id !== item.id; })
      .map(function (x) { return dir === 'en2jp' ? x.jp : x.en; });
    var options = optionsFor(answer, optionPool);
    return {
      kind: 'vocab',
      itemId: item.id,
      label: dir === 'en2jp' ? 'English → 日本語' : '日本語 → English',
      prompt: front,
      promptJa: hasJa(front),
      promptClass: '',
      options: options,
      correctIndex: Math.max(0, options.indexOf(answer)),
      answer: back,
      speech: item.jp,
      detailHtml: '<span class="jp">' + esc(item.jp) + '</span> — ' + esc(item.en)
    };
  }

  function kanjiCard(item) {
    var meaning = item.meanings.join(' / ');
    var roll = Math.random();
    var detail = '<span class="jp" style="font-family:var(--serif)">' + esc(item.kanji) + '</span> — ' + esc(meaning) +
      '<br>On: ' + esc(item.on.join('・') || '—') + ' · Kun: ' + esc(item.kun.join('・') || '—');

    if (roll < 0.5 || !item.on.length) {
      var meaningPool = state.items.kanji.filter(function (x) { return x.id !== item.id; })
        .map(function (x) { return x.meanings.join(' / '); });
      var meanings = optionsFor(meaning, meaningPool);
      return {
        kind: 'kanji', itemId: item.id, label: 'Kanji · meaning',
        prompt: item.kanji, promptJa: true, promptClass: 'glyph',
        options: meanings, correctIndex: Math.max(0, meanings.indexOf(meaning)),
        answer: meaning, speech: item.kanji, detailHtml: detail
      };
    }
    if (roll < 0.78) {
      var kanjiPool = state.items.kanji.filter(function (x) { return x.id !== item.id; })
        .map(function (x) { return x.kanji; });
      var kanjiOptions = optionsFor(item.kanji, kanjiPool);
      return {
        kind: 'kanji', itemId: item.id, label: 'Meaning · kanji',
        prompt: meaning, promptJa: false, promptClass: 'small',
        options: kanjiOptions, correctIndex: Math.max(0, kanjiOptions.indexOf(item.kanji)),
        answer: item.kanji, speech: item.kanji, detailHtml: detail
      };
    }
    var reading = item.on[0];
    var readingPool = state.items.kanji.filter(function (x) { return x.id !== item.id && x.on.length; })
      .map(function (x) { return x.on[0]; });
    var readings = optionsFor(reading, readingPool);
    return {
      kind: 'kanji', itemId: item.id, label: 'Kanji · on-yomi',
      prompt: item.kanji, promptJa: true, promptClass: 'glyph',
      options: readings, correctIndex: Math.max(0, readings.indexOf(reading)),
      answer: reading, speech: item.kanji, detailHtml: detail
    };
  }

  function structureCard(item) {
    var s = item.entry;
    var patternFirst = Math.random() < 0.5;
    var english = s.english_template || s.name;
    var example = s.example && s.example.japanese
      ? '<span class="jp">' + esc(s.example.japanese) + '</span> — ' + esc(s.example.english)
      : '';
    var detail = '<span class="jp">' + esc(s.pattern) + '</span><br>' + esc(english) +
      (example ? '<br>' + example : '') + '<br><small>' + esc(s.formation) + '</small>';

    var shared = state.items.structures.filter(function (x) {
      return (x.entry.english_template || x.entry.name) === english;
    }).length > 1;

    if (patternFirst || shared) {
      var englishPool = state.items.structures.filter(function (x) { return x.id !== item.id; })
        .map(function (x) { return x.entry.english_template || x.entry.name; });
      var englishOptions = optionsFor(english, englishPool);
      return {
        kind: 'structure', itemId: item.id, label: 'Pattern · meaning',
        prompt: s.pattern, promptJa: hasJa(s.pattern), promptClass: 'small',
        options: englishOptions, correctIndex: Math.max(0, englishOptions.indexOf(english)),
        answer: english, speech: s.example && s.example.japanese, detailHtml: detail
      };
    }
    var patternPool = state.items.structures.filter(function (x) { return x.id !== item.id; })
      .map(function (x) { return x.entry.pattern; });
    var patternOptions = optionsFor(s.pattern, patternPool);
    return {
      kind: 'structure', itemId: item.id, label: 'Meaning · pattern',
      prompt: english, promptJa: false, promptClass: 'small',
      options: patternOptions, correctIndex: Math.max(0, patternOptions.indexOf(s.pattern)),
      answer: s.pattern, speech: s.example && s.example.japanese, detailHtml: detail
    };
  }

  function buildCards(deck, items) {
    var used = {};
    var cards = [];
    if (deck === 'sentences') {
      var guard = 0;
      while (cards.length < items.length && guard < items.length * 6) {
        var card = buildSentenceCard(used);
        if (card) cards.push(card);
        guard++;
      }
      return cards;
    }
    items.forEach(function (item) {
      if (item.deck === 'vocab') cards.push(vocabCard(item, state.setup.direction));
      else if (item.deck === 'kanji') cards.push(kanjiCard(item));
      else cards.push(structureCard(item));
    });
    return cards;
  }

  /* ---------------------------------------------------------------- *
   *  Sessions
   * ---------------------------------------------------------------- */

  function startSession(opts) {
    opts = opts || {};
    var deck = opts.deck || state.setup.deck;
    var mode = opts.mode || 'quiz';
    var scope = opts.scope || state.setup.scope;
    var count = opts.count != null ? opts.count : state.setup.count;

    var items = opts.items ? opts.items.slice() : (deck === 'sentences' ? [] : pickItems(deck, scope, count));
    var total = deck === 'sentences' ? (count === 'all' ? 12 : Number(count)) : items.length;
    if (deck === 'sentences') items = new Array(total).fill(null);
    if (!items.length) {
      toast('Nothing queued for that option — try “All”.');
      return;
    }

    var cards = buildCards(deck, items);
    if (!cards.length) {
      toast('Could not build sentences from this data.');
      return;
    }

    state.session = {
      mode: mode,
      deck: deck,
      label: opts.label || DECK_NAMES[deck] + (deck === 'sentences' ? ' practice' : ''),
      cards: cards,
      idx: 0,
      answered: null,
      flipped: false,
      results: [],
      correct: 0,
      finished: false,
      config: { deck: deck, mode: mode, count: count, scope: scope, label: opts.label || null }
    };

    if (currentRoute() !== 'study') location.hash = '#study';
    else render();
    if (window.scrollY > 60) window.scrollTo({ top: 0 });
  }

  function answerQuiz(index) {
    var s = state.session;
    if (!s || s.mode !== 'quiz' || s.finished || s.answered !== null) return;
    var card = s.cards[s.idx];
    if (index < 0 || index >= card.options.length) return;
    var ok = index === card.correctIndex;
    s.answered = index;
    if (ok) s.correct++;
    s.results.push({ card: card, correct: ok });
    if (card.itemId) recordAnswer(card.itemId, ok);
    render();
  }

  function nextCard() {
    var s = state.session;
    if (!s || s.mode !== 'quiz' || s.answered === null) return;
    if (s.idx >= s.cards.length - 1) s.finished = true;
    else { s.idx++; s.answered = null; }
    render();
    if (window.scrollY > 60) window.scrollTo({ top: 0 });
  }

  function flip() {
    var s = state.session;
    if (!s || s.mode !== 'flash' || s.finished) return;
    s.flipped = !s.flipped;
    render();
  }

  function gradeFlash(ok) {
    var s = state.session;
    if (!s || s.mode !== 'flash' || s.finished || !s.flipped) return;
    var card = s.cards[s.idx];
    if (!card) return;
    if (card.itemId) recordAnswer(card.itemId, ok);
    if (ok) s.correct++;
    s.results.push({ card: card, correct: ok });
    if (s.idx >= s.cards.length - 1) s.finished = true;
    else { s.idx++; s.flipped = false; }
    render();
    if (window.scrollY > 60) window.scrollTo({ top: 0 });
  }

  function restartSession() {
    var s = state.session;
    if (!s) return;
    startSession({ deck: s.config.deck, mode: s.config.mode, scope: s.config.scope, count: s.config.count, label: s.config.label });
  }

  function reviewMissed() {
    var s = state.session;
    if (!s) return;
    var cards = s.results.filter(function (r) { return !r.correct; }).map(function (r) { return r.card; });
    if (!cards.length) return;
    state.session = {
      mode: 'flash', deck: s.deck, label: 'Review',
      cards: cards, idx: 0, answered: null, flipped: false,
      results: [], correct: 0, finished: false,
      config: { deck: s.deck, mode: 'flash', count: cards.length, scope: 'all', label: 'Review' }
    };
    render();
  }

  function endSession() {
    state.session = null;
    render();
  }

      return hay.indexOf(q) !== -1;
    });
    var rows = list.length ? list.map(function (item) {
      var words = item.readings.map(function (r) {
        return '<span><b lang="ja">' + esc(r.written_form) + '</b> ' + esc(r.word_reading_kana) +
          (r.meaning_or_context ? ' · ' + esc(r.meaning_or_context) : '') + '</span>';
      }).join('');
      return '<details class="krow">' +
        '<summary>' + statusDot(item.id) +
          '<span class="kanji" lang="ja">' + esc(item.kanji) + '</span>' +
          '<span class="mean">' + esc(item.meanings.join(' / ')) + '</span>' +
          '<span class="read" lang="ja">' + esc(item.on.concat(item.kun).join('・')) + '</span>' +
        '</summary>' +
        '<div class="kbody">' +
          '<dl>' +
            '<dt>On</dt><dd lang="ja">' + esc(item.on.join('・') || '—') + '</dd>' +
            '<dt>Kun</dt><dd lang="ja">' + esc(item.kun.join('・') || '—') + '</dd>' +
          '</dl>' +
          (words ? '<div class="words">' + words + '</div>' : '') +
          (item.entry.notes ? '<p class="note">' + esc(item.entry.notes) + '</p>' : '') +
          sourcesHtml(item.entry.sources) +
        '</div>' +
      '</details>';
    }).join('') : '<p class="empty">No kanji match that search.</p>';

    return '<div class="page">' +
      '<div class="page-head"><h1>Kanji</h1><span class="count">' + list.length + ' of ' + state.items.kanji.length + '</span></div>' +
      '<div class="bar"><input type="search" id="kanji-search" placeholder="Search kanji, meaning or reading" value="' + esc(state.ui.kanjiQuery) + '" aria-label="Search kanji" autocomplete="off"></div>' +
      '<div class="rows">' + rows + '</div>' +
    '</div>';
  }

  function grammarView() {
    var q = state.ui.structQuery.trim().toLowerCase();
    var list = state.items.structures.filter(function (item) {
      if (!q) return true;
      var s = item.entry;
      var hay = [s.name, s.pattern, s.english_template, s.formation, s.category,
        s.example ? s.example.japanese : '', s.example ? s.example.english : ''].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    var blocks = list.length ? list.map(function (item) {
      var s = item.entry;
      var variants = (s.variants || []).map(function (v) {
        return '<div class="variant"><div class="jp-pattern jp" lang="ja">' + esc(v.pattern) + '</div>' +
          '<div class="en-pattern">' + esc(v.english_template) + '</div>' +
          (v.example ? '<div class="ex" lang="ja">' + esc(v.example.japanese) + ' <small>' + esc(v.example.english) + '</small></div>' : '') +
          '</div>';
      }).join('');
      return '<article class="pattern">' +
        '<div class="cat">' + esc(s.category) + '</div>' +
        '<div class="name">' + esc(s.name) + '</div>' +
        '<div class="jp-pattern jp" lang="ja">' + esc(s.pattern) + '</div>' +
        '<div class="en-pattern">' + esc(s.english_template) + '</div>' +
        (s.example ? '<div class="ex" lang="ja">' + esc(s.example.japanese) + speakBtn(s.example.japanese) +
          ' <small>' + esc(s.example.english) + '</small></div>' : '') +
        variants +
        '<details><summary>How it works</summary><p>' + esc(s.formation) + '</p>' +
          (s.notes ? '<p>' + esc(s.notes) + '</p>' : '') + sourcesHtml(s.sources) +
        '</details>' +
      '</article>';
    }).join('') : '<p class="empty">No patterns match that search.</p>';

    return '<div class="page">' +
      '<div class="page-head"><h1>Grammar</h1><span class="count">' + list.length + ' of ' + state.items.structures.length + '</span></div>' +
      '<div class="bar"><input type="search" id="struct-search" placeholder="Search patterns or meanings" value="' + esc(state.ui.structQuery) + '" aria-label="Search grammar" autocomplete="off"></div>' +
      '<div>' + blocks + '</div>' +
    '</div>';
  }

  function seg(key, value, label) {
    return '<button type="button" data-action="setup" data-key="' + key + '" data-value="' + value + '" aria-pressed="' +
      (String(state.setup[key]) === String(value)) + '">' + label + '</button>';
  }

  function studyView() {
    var s = state.session;
    if (s) return '<div class="page">' + (s.finished ? resultsView(s) : sessionHeader(s) + (s.mode === 'quiz' ? quizView(s) : flashView(s))) + '</div>';

    var setup = state.setup;
    var available = previewCount(setup.deck, setup.scope);
    var counts = { vocab: state.items.vocab.length, kanji: state.items.kanji.length, structures: state.items.structures.length, sentences: FRAMES.length };
    var isSentences = setup.deck === 'sentences';
    var groups = ['all', 'adjs', 'verbs', 'places', 'food', 'family', 'questions'];

    return '<div class="page">' +
      '<div class="page-head"><h1>Study</h1></div>' +
      '<div class="setup">' +
        '<div class="field"><label>Mode</label><div class="seg">' + seg('mode', 'quiz', 'Quiz') + seg('mode', 'flash', 'Flashcards') + '</div></div>' +
        '<div class="field"><label>Deck</label><div class="seg">' +
          seg('deck', 'vocab', 'Vocabulary') + seg('deck', 'kanji', 'Kanji') +
          seg('deck', 'structures', 'Grammar') + seg('deck', 'sentences', 'Sentences') +
        '</div></div>' +
        (isSentences
          ? '<div class="field"><label>Sentence focus</label><div class="seg">' +
              groups.map(function (g) { return seg('group', g, g === 'all' ? 'All' : META[g].name); }).join('') +
            '</div></div>'
          : '<div class="field"><label>What to study</label><div class="seg">' +
              seg('scope', 'smart', 'Due + new') + seg('scope', 'new', 'New') +
              seg('scope', 'tricky', 'Tricky') + seg('scope', 'all', 'All') +
            '</div></div>') +
        (setup.deck === 'vocab'
          ? '<div class="field"><label>Prompt</label><div class="seg">' +
              seg('direction', 'en2jp', 'English → 日本語') + seg('direction', 'jp2en', '日本語 → English') + seg('direction', 'mixed', 'Both') +
            '</div></div>'
          : '') +
        '<div class="field"><label>Cards</label><div class="seg">' +
          ['8', '12', '20'].map(function (n) { return seg('count', n, n); }).join('') + seg('count', 'all', 'All') +
        '</div></div>' +
        '<div>' +
          '<button class="btn btn-solid btn-wide" data-action="start-study">Start</button>' +
          '<p class="start-note">' + (isSentences
            ? 'Builds sentences from vocabulary that fits each pattern — adjectives with adjectives, food with food, places with places.'
            : available + ' cards match this choice' + (available === 0 ? ' — try “All”.' : '.')) + '</p>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function sessionHeader(s) {
    var total = s.cards.length;
    var pos = s.idx + 1;
    return '<div class="session-top">' +
      '<span class="pos">' + pos + ' / ' + total + '</span>' +
      '<span class="track"><span style="width:' + percent(pos, total) + '%"></span></span>' +
      '<button class="btn btn-quiet btn-sm" data-action="end">End</button>' +
    '</div>';
  }

  function quizView(s) {
    var card = s.cards[s.idx];
    var answered = s.answered;
    var ok = answered !== null && answered === card.correctIndex;
    var isLast = s.idx === s.cards.length - 1;

    var options = card.options.map(function (option, i) {
      var cls = 'answer';
      if (hasJa(option)) cls += ' jp';
      if (card.kind === 'kanji' && /^[\u3400-\u9fff]$/.test(option)) cls += ' kanji';
      if (String(option).length > 48) cls += ' long';
      if (answered !== null) {
        if (i === card.correctIndex) cls += ' ok';
        else if (i === answered) cls += ' no';
        else cls += ' dim';
      }
      return '<button type="button" class="' + cls + '" data-action="answer" data-index="' + i + '"' + (answered !== null ? ' disabled' : '') + '>' +
        '<span class="k">' + (i + 1) + '</span>' +
        '<span class="t"' + (hasJa(option) ? ' lang="ja"' : '') + '>' + esc(option) + '</span>' +
      '</button>';
    }).join('');

    var after = answered !== null
      ? '<div class="after">' +
          '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? 'Correct' : 'Not quite') +
            (card.speech ? ' ' + speakBtn(card.speech) : '') + '</div>' +
          '<div class="detail">' + card.detailHtml + '</div>' +
          '<div class="buttons"><button class="btn btn-solid" data-action="next">' + (isLast ? 'See results' : 'Next') + '</button></div>' +
        '</div>'
      : '<p class="shortcut">Press <kbd>1</kbd>–<kbd>4</kbd> to answer</p>';

    return '<div class="quiz">' +
      '<div class="q-label">' + esc(card.label) + '</div>' +
      '<div class="q-text ' + (card.promptClass || '') + (card.promptJa ? ' jp' : '') + '"' + (card.promptJa ? ' lang="ja"' : '') + '>' + card.prompt + '</div>' +
      '<div class="answers">' + options + '</div>' +
      after +
    '</div>';
  }

  function flashView(s) {
    var card = s.cards[s.idx];
    var front = '<div class="card-label">' + esc(card.label) + '</div>' +
      '<div class="card-big ' + (card.promptClass === 'glyph' ? 'glyph' : '') + (card.promptJa ? ' jp' : '') + '"' + (card.promptJa ? ' lang="ja"' : '') + '>' +
        card.prompt + '</div>' +
      '<div class="card-hint">' + (s.flipped ? 'Tap to hide' : 'Tap to reveal') + '</div>';

    var back = '<div class="card-label">Answer</div>' +
      '<div class="card-big' + (card.kind === 'kanji' && !hasJa(card.answer) ? '' : ' jp') + '" lang="ja">' + esc(card.answer) + '</div>' +
      '<div class="card-sub">' + (card.englishHtml || card.detailHtml) + '</div>' +
      (card.speech ? speakBtn(card.speech) : '') +
      '<div class="card-hint">Tap to hide</div>';

    return '<div class="card-face" role="button" tabindex="0" data-action="flip" aria-pressed="' + s.flipped + '">' +
      (s.flipped ? back : front) +
    '</div>' +
    '<div class="card-actions">' +
      '<button type="button" class="btn" data-action="grade" data-ok="0"' + (s.flipped ? '' : ' disabled') + '>Again</button>' +
      '<button type="button" class="btn btn-solid" data-action="grade" data-ok="1"' + (s.flipped ? '' : ' disabled') + '>Got it</button>' +
    '</div>' +
    '<p class="shortcut">' + (s.flipped ? 'Grade yourself to continue' : 'Press <kbd>Space</kbd> to reveal') + '</p>';
  }

  function resultsView(s) {
    var total = s.results.length;
    var pct = percent(s.correct, total);
    var missed = s.results.filter(function (r) { return !r.correct; });
    var rows = missed.slice(0, 12).map(function (r) {
      return '<div class="row"><span class="en">' + r.card.answer + '</span>' +
        '<span class="jp wide" lang="ja">' + r.card.detailHtml.split('<br>')[0] + '</span></div>';
    }).join('');

    return '<div class="result">' +
      '<div class="score">' + pct + '%<small>' + s.correct + ' of ' + total + '</small></div>' +
      '<p class="muted" style="margin-top:10px">' + (pct >= 80 ? 'Nice work.' : pct >= 50 ? 'Getting there.' : 'Worth another round.') + '</p>' +
      '<div class="buttons">' +
        (missed.length ? '<button class="btn btn-solid" data-action="review-missed">Review ' + missed.length + '</button>' : '') +
        '<button class="btn" data-action="restart">Again</button>' +
        '<button class="btn btn-quiet" data-action="end">Done</button>' +
      '</div>' +
      (missed.length ? '<h3>Missed</h3><div class="rows">' + rows + '</div>' : '') +
    '</div>';
  }

  /* ---------------------------------------------------------------- *
   *  Routing, events, speech
   * ---------------------------------------------------------------- */

  function currentRoute() {
    var r = location.hash.replace(/^#\/?/, '');
    return ROUTES.indexOf(r) !== -1 ? r : 'home';
  }

  function render() {
    var view = $('#view');
    if (state.error) { view.innerHTML = failView(state.error); return; }
    if (!state.loaded) return;

    var route = currentRoute();
    state.route = route;
    view.innerHTML = route === 'vocab' ? vocabView()
      : route === 'kanji' ? kanjiView()
      : route === 'grammar' ? grammarView()
      : route === 'study' ? studyView()
      : homeView();

    $all('[data-nav]').forEach(function (link) {
      if (link.dataset.nav === route) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
    document.title = route === 'home' ? 'Year 8 Japanese' : route.charAt(0).toUpperCase() + route.slice(1) + ' · Year 8 Japanese';
    updateStreak();

    var note = $('#storage-note');
    if (note && !storageOK) note.textContent = 'Progress cannot be saved in this browser';
  }

  function failView(err) {
    var hint = location.protocol === 'file:'
      ? '<p>This page is open as a local file, and browsers block <code>fetch()</code> there. Run <code>python3 -m http.server</code> and open <code>http://localhost:8000</code>.</p>'
      : '<p>Check that <code>vocab.json</code>, <code>kanji.json</code> and <code>structures.json</code> sit next to <code>index.html</code>.</p>';
    return '<div class="fail"><h2>Could not load the study data</h2>' +
      '<p>' + esc(err && err.message ? err.message : 'The request failed.') + '</p>' + hint +
      '<button class="btn" data-action="retry" style="margin-top:12px">Try again</button></div>';
  }

  function speak(text) {
    var clean = String(text || '')
      .replace(/[（(][^）)]*[）)]/g, '')
      .replace(/＿+/g, '')
      .split(' / ')[0]
      .trim();
    if (!clean || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'ja-JP';
      utter.rate = 0.88;
      var ja = (window.speechSynthesis.getVoices() || []).filter(function (v) { return /^ja/i.test(v.lang); })[0];
      if (ja) utter.voice = ja;
      window.speechSynthesis.speak(utter);
    } catch (e) { /* ignore */ }
  }

  function toast(message) {
    var host = $('#toasts');
    if (!host) return;
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = message;
    host.appendChild(el);
    setTimeout(function () { el.remove(); }, 2400);
  }

  function resetProgress() {
    if (!window.confirm('Reset all progress? Mastery, history and streaks will be cleared.')) return;
    state.progress = {};
    state.activity = {};
    saveStore();
    render();
    toast('Progress reset');
  }

  function bindEvents() {
    document.addEventListener('click', function (event) {
      var el = event.target.closest('[data-action]');
      if (!el) return;
      var action = el.dataset.action;

      if (action === 'speak') { event.preventDefault(); event.stopPropagation(); speak(el.dataset.speak); return; }
      if (action === 'theme') { toggleTheme(); return; }
      if (action === 'reset') { resetProgress(); return; }
      if (action === 'retry') { state.error = null; state.loaded = false; $('#view').innerHTML = '<p class="load">Loading…</p>'; loadData(); return; }

      if (action === 'setup') {
        var key = el.dataset.key;
        var value = el.dataset.value;
        state.setup[key] = key === 'count' && value !== 'all' ? Number(value) : value;
        render();
        return;
      }
      if (action === 'start-study') {
        startSession({ deck: state.setup.deck, mode: state.setup.mode, scope: state.setup.scope, count: state.setup.count });
        return;
      }
      if (action === 'sentence-practice') {
        state.setup.deck = 'sentences';
        state.setup.mode = 'quiz';
        startSession({ deck: 'sentences', mode: 'quiz', count: 8 });
        return;
      }
      if (action === 'quick-review') {
        if (previewCount('mixed', 'smart') === 0) { toast('Nothing due — try All in Study.'); return; }
        startSession({ deck: 'mixed', mode: 'quiz', scope: 'smart', count: 12 });
        return;
      }
      if (action === 'answer') { answerQuiz(Number(el.dataset.index)); return; }
      if (action === 'next') { nextCard(); return; }
      if (action === 'flip') { flip(); return; }
      if (action === 'grade') { gradeFlash(el.dataset.ok === '1'); return; }
      if (action === 'end') { endSession(); return; }
      if (action === 'restart') { restartSession(); return; }
      if (action === 'review-missed') { reviewMissed(); return; }
    });

    document.addEventListener('input', function (event) {
      var id = event.target.id;
      if (id === 'vocab-search') {
        state.ui.vocabQuery = event.target.value;
        var list = state.items.vocab.filter(function (item) {
          var q = state.ui.vocabQuery.trim().toLowerCase();
          return !q || item.en.toLowerCase().indexOf(q) !== -1 || item.jp.indexOf(q) !== -1;
        });
        $('.rows').innerHTML = list.length ? list.map(function (item) {
          return '<div class="row">' + statusDot(item.id) +
            '<span class="en">' + esc(item.en) + '</span>' +
            '<span class="jp" lang="ja">' + esc(item.jp) + '</span>' +
            speakBtn(item.jp) + '</div>';
        }).join('') : '<p class="empty">No words match.</p>';
        $('.count').textContent = list.length + ' of ' + state.items.vocab.length;
      } else if (id === 'kanji-search') {
        state.ui.kanjiQuery = event.target.value;
        render();
        var box = $('#kanji-search');
        if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
      } else if (id === 'struct-search') {
        state.ui.structQuery = event.target.value;
        render();
        var box2 = $('#struct-search');
        if (box2) { box2.focus(); box2.setSelectionRange(box2.value.length, box2.value.length); }
      }
    });

    document.addEventListener('keydown', function (event) {
      var route = currentRoute();
      if (route !== 'study' || !state.session || state.session.finished) return;
      var target = event.target;
      var closest = target && typeof target.closest === 'function' ? function (s) { return target.closest(s); } : function () { return null; };
      if (closest('input, textarea, select')) return;
      var onControl = !!closest('button, a');
      var s = state.session;

      if (s.mode === 'quiz') {
        if (s.answered === null && /^[1-4]$/.test(event.key)) {
          event.preventDefault();
          answerQuiz(Number(event.key) - 1);
        } else if (s.answered !== null && event.key === 'Enter' && !onControl) {
          event.preventDefault();
          nextCard();
        }
        return;
      }
      if (event.key === ' ' && !onControl) { event.preventDefault(); flip(); }
      else if (event.key === 'Enter' && !onControl) { event.preventDefault(); if (s.flipped) gradeFlash(true); else flip(); }
      else if (event.key === 'ArrowRight' && s.flipped) { event.preventDefault(); gradeFlash(true); }
      else if (event.key === 'ArrowLeft' && s.flipped) { event.preventDefault(); gradeFlash(false); }
    });

    window.addEventListener('hashchange', function () {
      if (currentRoute() !== state.route) window.scrollTo({ top: 0 });
      render();
    });
  }

  loadStore();
  applyTheme();
  bindEvents();
  loadData();
})();

</script>
</body>
</html>
