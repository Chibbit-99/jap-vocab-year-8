<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="A self-contained study app for Year 8 Japanese: vocabulary, kanji and grammar patterns, with flashcards, quizzes and smart review." />
<meta name="theme-color" content="#f6f1e7" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%232c4a73%22/%3E%3Ctext x=%2232%22 y=%2245%22 font-family=%22serif%22 font-size=%2238%22 fill=%22%23f6f1e7%22 text-anchor=%22middle%22%3E%E5%AD%A6%3C/text%3E%3C/svg%3E" />
<title>Year 8 Japanese · Study companion</title>
<style>
  :root {
    --bg: #f6f1e7;
    --bg-2: #efe7d9;
    --surface: #fffdf7;
    --surface-2: #faf5ea;
    --ink: #23262d;
    --muted: #706a5f;
    --line: #e4dac9;
    --line-strong: #d1c2a9;
    --indigo: #2c4a73;
    --indigo-soft: #e8eef7;
    --primary: #2c4a73;
    --primary-ink: #ffffff;
    --vermilion: #bb4b37;
    --vermilion-soft: #fbeae5;
    --green: #2f7d5b;
    --green-soft: #e7f3ec;
    --red: #b7402f;
    --red-soft: #fbe9e6;
    --gold: #9c7621;
    --gold-soft: #f7efdc;
    --shadow: 0 1px 2px rgba(35, 32, 25, .04), 0 10px 28px rgba(35, 32, 25, .06);
    --shadow-lg: 0 2px 4px rgba(35, 32, 25, .05), 0 22px 50px rgba(35, 32, 25, .12);
    --radius: 16px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
  }

  [data-theme="dark"] {
    --bg: #14161b;
    --bg-2: #1a1d24;
    --surface: #1e222a;
    --surface-2: #252a33;
    --ink: #ece7df;
    --muted: #a39c90;
    --line: #333944;
    --line-strong: #4a5361;
    --indigo: #9ab6de;
    --indigo-soft: #222e3f;
    --primary: #9ab6de;
    --primary-ink: #10141a;
    --vermilion: #e3816d;
    --vermilion-soft: #37241f;
    --green: #74c39b;
    --green-soft: #1b3027;
    --red: #e58d7e;
    --red-soft: #37211e;
    --gold: #d8b768;
    --gold-soft: #302815;
    --shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 12px 30px rgba(0, 0, 0, .22);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .3), 0 26px 60px rgba(0, 0, 0, .45);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 12% 0%, rgba(44, 74, 115, .055), transparent 38rem),
      radial-gradient(circle at 88% 12%, rgba(187, 75, 55, .045), transparent 34rem),
      repeating-linear-gradient(0deg, rgba(120, 100, 70, .022) 0 1px, transparent 1px 5px);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  [data-theme="dark"] body {
    background-image:
      radial-gradient(circle at 12% 0%, rgba(120, 155, 205, .09), transparent 40rem),
      radial-gradient(circle at 88% 12%, rgba(200, 110, 85, .06), transparent 36rem),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, .012) 0 1px, transparent 1px 5px);
  }

  ::selection { background: rgba(44, 74, 115, .2); }
  [data-theme="dark"] ::selection { background: rgba(154, 182, 222, .3); }

  :focus-visible {
    outline: 2.5px solid var(--vermilion);
    outline-offset: 3px;
    border-radius: 4px;
  }

  button, input, select { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  a { color: var(--indigo); }
  h1, h2, h3, h4, p { margin: 0; }
  ul { margin: 0; }

  .skip-link {
    position: absolute; left: 16px; top: -80px; z-index: 200;
    background: var(--primary); color: var(--primary-ink);
    padding: 10px 16px; border-radius: 0 0 10px 10px; text-decoration: none;
    transition: top .2s;
  }
  .skip-link:focus { top: 0; }

  /* ---------- Header ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: rgba(246, 241, 231, .86);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  [data-theme="dark"] .topbar { background: rgba(20, 22, 27, .86); }

  .topbar-inner {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; gap: 18px;
    padding: 11px 24px;
  }

  .brand {
    display: flex; align-items: center; gap: 11px;
    text-decoration: none; color: inherit; flex-shrink: 0;
  }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 13px;
    background: linear-gradient(150deg, #3a5c88, #1c3150);
    color: #fff; display: grid; place-items: center;
    font-family: var(--serif); font-size: 24px; line-height: 1;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 4px 12px rgba(28, 49, 80, .24);
    position: relative;
  }
  .brand-mark::after {
    content: ""; position: absolute; right: -4px; bottom: -4px;
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--vermilion); border: 2.5px solid var(--bg);
  }
  .brand-title { display: block; font-family: var(--serif); font-size: 17px; line-height: 1.15; letter-spacing: .005em; }
  .brand-sub { display: block; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }

  .main-nav {
    display: flex; gap: 2px; margin-left: auto;
    padding: 4px; border: 1px solid var(--line);
    background: var(--surface-2); border-radius: 999px;
  }
  .main-nav a {
    padding: 7px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; letter-spacing: .01em;
    color: var(--muted); text-decoration: none; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .main-nav a:hover { color: var(--ink); background: var(--surface); }
  .main-nav a.active { background: var(--surface); color: var(--indigo); box-shadow: 0 1px 3px rgba(35, 32, 25, .09); }

  .top-actions { display: flex; align-items: center; gap: 8px; }
  .streak-pill {
    font-size: 11.5px; font-weight: 700; color: var(--vermilion);
    background: var(--vermilion-soft); border: 1px solid rgba(187, 75, 55, .18);
    padding: 5px 10px; border-radius: 999px; white-space: nowrap;
  }

  .icon-btn {
    width: 36px; height: 36px; flex: none;
    display: inline-grid; place-items: center;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--muted); cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line-strong); }
  .icon-btn svg { width: 18px; height: 18px; }
  .theme-toggle .icon-moon { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: block; }

  /* ---------- Layout ---------- */
  .wrap { max-width: 1120px; margin: 0 auto; padding: 34px 24px 80px; }
  #view { animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .eyebrow {
    font-size: 10.5px; letter-spacing: .19em; text-transform: uppercase;
    color: var(--vermilion); font-weight: 800;
  }
  .muted { color: var(--muted); }
  .dim { opacity: .55; }
  .jp { font-family: var(--font); }
  .serif { font-family: var(--serif); }

  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px; flex-wrap: wrap; margin-bottom: 22px;
  }
  .page-head h1 { font-family: var(--serif); font-size: clamp(30px, 4vw, 40px); line-height: 1.08; letter-spacing: -.015em; margin-top: 4px; }
  .page-head p { color: var(--muted); font-size: 14.5px; margin-top: 7px; max-width: 62ch; }
  .page-head .head-stats { display: flex; gap: 22px; flex-wrap: wrap; }
  .head-stat { text-align: right; }
  .head-stat b { display: block; font-family: var(--serif); font-size: 25px; line-height: 1.1; }
  .head-stat span { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; margin: 40px 0 14px;
  }
  .section-head h2 { font-family: var(--serif); font-size: 25px; letter-spacing: -.01em; }
  .section-head .link { font-size: 13px; font-weight: 600; text-decoration: none; }
  .section-head .link:hover { text-decoration: underline; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid transparent; border-radius: 11px;
    padding: 9px 15px; font-size: 13.5px; font-weight: 700; line-height: 1.25;
    cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: transform .12s, background .15s, border-color .15s, box-shadow .15s, color .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-primary { background: var(--primary); color: var(--primary-ink); box-shadow: 0 3px 10px rgba(28, 49, 80, .16); }
  .btn-primary:hover { filter: brightness(1.07); }
  [data-theme="dark"] .btn-primary { box-shadow: 0 3px 12px rgba(0, 0, 0, .3); }
  .btn-outline { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
  .btn-outline:hover { background: var(--surface-2); border-color: var(--muted); }
  .btn-soft { background: var(--indigo-soft); color: var(--indigo); border-color: transparent; }
  .btn-soft:hover { filter: brightness(.98); box-shadow: inset 0 0 0 1px rgba(44, 74, 115, .15); }
  .btn-vermilion { background: var(--vermilion); color: #fff; }
  .btn-vermilion:hover { filter: brightness(1.06); }
  .btn-lg { padding: 13px 22px; font-size: 14.5px; border-radius: 13px; }
  .btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 9px; }
  .btn-block { width: 100%; }

  .link-btn {
    background: none; border: 0; padding: 0; cursor: pointer;
    font-size: 12.5px; font-weight: 600; color: var(--muted);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .link-btn:hover { color: var(--vermilion); }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 6px;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
    white-space: nowrap;
  }
  .badge-indigo { background: var(--indigo-soft); color: var(--indigo); border-color: transparent; }
  .badge-vermilion { background: var(--vermilion-soft); color: var(--vermilion); border-color: transparent; }
  .badge-green { background: var(--green-soft); color: var(--green); border-color: transparent; }
  .badge-gold { background: var(--gold-soft); color: var(--gold); border-color: transparent; }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
  .dot.new { background: transparent; border: 1.5px solid var(--line-strong); }
  .dot.learning { background: var(--gold); }
  .dot.mastered { background: var(--green); }

  .status-line { display: flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

  /* ---------- Cards / home ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .hero { display: grid; grid-template-columns: 1.3fr .7fr; gap: 18px; }
  .hero-copy {
    position: relative; overflow: hidden;
    padding: 42px 40px 36px;
    border: 1px solid var(--line); border-radius: 24px;
    background: linear-gradient(150deg, var(--surface), var(--surface-2));
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; justify-content: center;
  }
  .hero-copy::before {
    content: "日本語";
    position: absolute; right: -26px; top: -56px;
    writing-mode: vertical-rl;
    font-family: var(--serif); font-size: 154px; line-height: .95;
    letter-spacing: .03em; color: var(--indigo); opacity: .045;
    pointer-events: none;
  }
  .hero-title {
    position: relative;
    font-family: var(--serif); font-size: clamp(34px, 4.6vw, 52px);
    line-height: 1.04; letter-spacing: -.025em; margin: 14px 0 15px;
  }
  .hero-title em { font-style: normal; color: var(--indigo); }
  .hero-sub { position: relative; color: var(--muted); font-size: 15px; line-height: 1.68; max-width: 52ch; }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 25px; }
  .hero-meta {
    display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    margin-top: 22px; padding-top: 16px; border-top: 1px dashed var(--line);
    font-size: 12px; color: var(--muted);
  }
  .hero-meta b { color: var(--ink); }

  .hero-art {
    position: relative; overflow: hidden; min-height: 300px;
    border-radius: 24px; border: 1px solid rgba(255, 255, 255, .08);
    background:
      radial-gradient(circle at 70% 20%, rgba(255, 255, 255, .14), transparent 45%),
      linear-gradient(160deg, #33537c, #1a2d49 70%);
    color: #f4ecdc;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
  }
  .hero-art::before {
    content: ""; position: absolute; inset: 0; opacity: .16;
    background-image: radial-gradient(circle at 50% 50%, transparent 0 26px, rgba(255, 255, 255, .5) 27px 28px, transparent 29px 54px, rgba(255, 255, 255, .35) 55px 56px, transparent 57px);
    background-size: 110px 110px;
  }
  .hero-kanji { position: relative; font-family: var(--serif); font-size: clamp(96px, 13vw, 142px); line-height: 1; }
  .hero-art-caption { position: relative; margin-top: 6px; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: rgba(244, 236, 220, .66); }
  .seal {
    position: absolute; right: 18px; bottom: 18px;
    width: 46px; height: 46px; border: 1.5px solid rgba(244, 236, 220, .55); border-radius: 6px;
    display: grid; place-items: center;
    font-family: var(--serif); font-size: 13px; letter-spacing: .02em;
    color: rgba(244, 236, 220, .82);
    transform: rotate(-4deg);
  }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
  .stat-card { padding: 17px 18px 15px; }
  .stat-label { font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
  .stat-value { font-family: var(--serif); font-size: 30px; line-height: 1.15; margin-top: 4px; letter-spacing: -.02em; }
  .stat-value small { font-family: var(--font); font-size: 12px; color: var(--muted); letter-spacing: 0; font-weight: 600; }
  .stat-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .stat-card.accent .stat-value { color: var(--vermilion); }

  .bar { height: 5px; border-radius: 999px; background: var(--bg-2); overflow: hidden; margin-top: 10px; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--indigo), #6e8fb8); transition: width .4s ease; }
  .bar.green > span { background: linear-gradient(90deg, #3d8d68, var(--green)); }
  .bar.vermilion > span { background: linear-gradient(90deg, #cf705d, var(--vermilion)); }

  .deck-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .deck-card { padding: 20px; display: flex; flex-direction: column; gap: 12px; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .deck-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--line-strong); }
  .deck-top { display: flex; gap: 12px; align-items: flex-start; }
  .deck-icon {
    width: 46px; height: 46px; border-radius: 12px; flex: none;
    display: grid; place-items: center;
    font-family: var(--serif); font-size: 22px;
    background: var(--indigo-soft); color: var(--indigo);
  }
  .deck-icon.vermilion { background: var(--vermilion-soft); color: var(--vermilion); }
  .deck-icon.green { background: var(--green-soft); color: var(--green); }
  .deck-name { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
  .deck-jp { font-size: 11px; color: var(--muted); letter-spacing: .1em; margin-top: 1px; }
  .deck-desc { font-size: 13px; line-height: 1.55; color: var(--muted); flex: 1; }
  .deck-nums { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); }
  .deck-nums b { color: var(--ink); font-weight: 700; }
  .deck-actions { display: flex; gap: 8px; margin-top: 2px; }
  .deck-actions .btn { flex: 1; }

  .review-banner {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 20px; margin-top: 18px;
    border: 1px solid rgba(187, 75, 55, .2); border-radius: 14px;
    background: linear-gradient(100deg, var(--vermilion-soft), var(--surface));
  }
  .review-banner .icon {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    background: var(--vermilion); color: #fff; font-size: 17px;
  }
  .review-banner h3 { font-size: 14px; }
  .review-banner p { font-size: 12.5px; color: var(--muted); }
  .review-banner .btn { margin-left: auto; }

  .how-card { padding: 22px 24px; display: grid; grid-template-columns: 1.2fr .8fr; gap: 24px; align-items: center; }
  .how-card h3 { font-family: var(--serif); font-size: 20px; margin-bottom: 6px; }
  .how-card p { font-size: 13px; color: var(--muted); line-height: 1.65; }
  .how-steps { display: flex; gap: 8px; flex-wrap: wrap; }
  .how-step { font-size: 11.5px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); padding: 7px 10px; border-radius: 8px; }

  /* ---------- Toolbars ---------- */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .search { position: relative; flex: 1 1 280px; min-width: 200px; }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; padding: 11px 14px 11px 38px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
    font-size: 14px; transition: border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--muted); opacity: .8; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search input:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); }
  .control {
    padding: 10px 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 11px; font-size: 13px; cursor: pointer; color: var(--ink);
  }
  .control:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 6px 12px;
    font-size: 12px; font-weight: 700; color: var(--muted);
    cursor: pointer; transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--line-strong); color: var(--ink); }
  .chip.active { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  [data-theme="dark"] .chip.active { color: var(--primary-ink); }

  .results-meta {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; margin: 4px 0 14px;
    font-size: 12px; color: var(--muted);
  }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; }

  /* ---------- Vocabulary ---------- */
  .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(246px, 1fr)); gap: 10px; }
  .vocab-card {
    position: relative; padding: 13px 14px 12px;
    border: 1px solid var(--line); border-radius: 13px;
    background: var(--surface);
    transition: transform .14s, box-shadow .14s, border-color .14s;
  }
  .vocab-card:hover { transform: translateY(-1px); border-color: var(--line-strong); box-shadow: var(--shadow); }
  .vocab-top { display: flex; align-items: flex-start; gap: 8px; justify-content: space-between; }
  .vocab-en { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .015em; line-height: 1.4; }
  .vocab-jp { font-size: 20px; line-height: 1.45; margin-top: 3px; word-break: break-word; }
  .vocab-status { margin-top: 8px; }
  .speak-btn { width: 27px; height: 27px; border-radius: 8px; flex: none; }
  .speak-btn svg { width: 14px; height: 14px; }

  /* ---------- Kanji ---------- */
  .kanji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; }
  .kanji-tile {
    position: relative; text-align: left; cursor: pointer;
    padding: 15px 15px 13px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); color: var(--ink);
    transition: transform .14s, box-shadow .14s, border-color .14s;
  }
  .kanji-tile:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow); }
  .kanji-glyph { display: block; font-family: var(--serif); font-size: 44px; line-height: 1.1; }
  .kanji-mean { display: -webkit-box; font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.45; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .kanji-tile .status-line { display: flex; }
  .kanji-num { position: absolute; top: 11px; right: 11px; }
  .kanji-tile .status-line { margin-top: 9px; font-size: 9.5px; }

  /* ---------- Grammar ---------- */
  .pattern-list { display: grid; gap: 13px; }
  .pattern-card { padding: 22px 24px; }
  .pattern-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 9px; }
  .pattern-meta .cat { font-size: 11px; color: var(--muted); }
  .pattern-name { font-size: 14px; font-weight: 800; letter-spacing: -.005em; margin-bottom: 5px; }
  .pattern-line {
    font-size: clamp(19px, 2.4vw, 24px); line-height: 1.55;
    letter-spacing: .005em; word-break: break-word;
  }
  .pattern-english { color: var(--muted); font-size: 13.5px; margin-top: 3px; max-width: 82ch; }
  .formation {
    margin-top: 13px; padding: 11px 13px;
    background: var(--surface-2); border-radius: 10px;
    font-size: 12.8px; line-height: 1.62; color: var(--muted);
    max-width: 82ch;
  }
  .formation b { display: block; font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink); margin-bottom: 3px; }
  .example {
    margin-top: 13px; padding: 12px 15px;
    background: var(--indigo-soft); border-left: 3px solid var(--indigo);
    border-radius: 0 10px 10px 0;
  }
  .example-row { display: flex; align-items: flex-start; gap: 9px; }
  .ex-tag { font-size: 9.5px; font-weight: 800; letter-spacing: .1em; background: var(--indigo); color: #fff; border-radius: 4px; padding: 2px 5px; margin-top: 5px; flex: none; }
  [data-theme="dark"] .ex-tag { color: var(--primary-ink); }
  .example-jp { font-size: 16.5px; line-height: 1.55; flex: 1; }
  .example-en { font-size: 12.5px; color: var(--muted); margin-top: 3px; padding-left: 30px; }
  .variant { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .variant .ex-tag { background: var(--vermilion); }
  .variant .example { background: var(--vermilion-soft); border-left-color: var(--vermilion); margin-top: 7px; }
  .note {
    margin-top: 12px; padding: 10px 13px; border-radius: 10px;
    background: var(--gold-soft); font-size: 12px; line-height: 1.6; color: var(--ink);
    display: flex; gap: 9px;
  }
  .note b { flex: none; }
  .sources { margin-top: 12px; font-size: 11.5px; color: var(--muted); }
  .sources summary { cursor: pointer; font-weight: 700; letter-spacing: .02em; }
  .sources ul { padding-left: 18px; margin-top: 6px; }
  .sources li { margin: 2px 0; }

  /* ---------- Study setup ---------- */
  .setup-grid { display: grid; grid-template-columns: 1.45fr .75fr; gap: 18px; align-items: start; }
  .setup-card { padding: 26px; }
  .field { margin-bottom: 21px; }
  .field-label { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .field-label span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
  .field-label em { font-style: normal; font-size: 11.5px; color: var(--muted); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg-btn {
    border: 1.5px solid var(--line); background: var(--surface);
    border-radius: 10px; padding: 9px 13px;
    font-size: 12.5px; font-weight: 700; color: var(--muted);
    cursor: pointer; transition: all .15s; text-align: left;
  }
  .seg-btn:hover { border-color: var(--line-strong); color: var(--ink); }
  .seg-btn.active { border-color: var(--indigo); background: var(--indigo-soft); color: var(--indigo); }
  .seg-btn small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 1px; }
  .seg-btn.active small { color: var(--indigo); opacity: .8; }

  .setup-summary {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 13px 15px; border-radius: 11px;
    background: var(--surface-2); border: 1px dashed var(--line-strong);
    font-size: 12.5px; color: var(--muted); margin-bottom: 14px;
  }
  .setup-summary b { font-family: var(--serif); font-size: 21px; color: var(--ink); }
  .setup-summary .dot-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--line-strong); }

  .study-aside { padding: 22px; }
  .study-aside h3 { font-family: var(--serif); font-size: 19px; margin-bottom: 7px; }
  .study-aside p { font-size: 12.5px; color: var(--muted); line-height: 1.65; }
  .due-list { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 7px; }
  .due-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; padding-bottom: 7px; border-bottom: 1px dashed var(--line); }
  .due-list li:last-child { border-bottom: 0; padding-bottom: 0; }
  .due-list b { font-size: 13.5px; }
  .kbd-hint { font-size: 11.5px; color: var(--muted); margin-top: 12px; line-height: 1.7; }
  kbd {
    display: inline-block; min-width: 18px; text-align: center;
    padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-strong);
    background: var(--surface); font-family: inherit; font-size: 10px; font-weight: 700;
    box-shadow: 0 1px 0 var(--line); color: var(--ink);
  }

  /* ---------- Session ---------- */
  .session { max-width: 800px; margin: 0 auto; }
  .session-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .session-title { font-family: var(--serif); font-size: 19px; line-height: 1.2; }
  .session-title small { display: block; font-family: var(--font); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .session-progress { flex: 1; min-width: 130px; height: 7px; background: var(--bg-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
  .session-progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--indigo), #7d9cc4); border-radius: inherit; transition: width .3s ease; }
  .session-counter { font-size: 11.5px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .quiz-card { padding: 30px 32px 26px; border-radius: 20px; }
  .quiz-meta { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 18px; }
  .quiz-meta .spacer { flex: 1; }
  .quiz-prompt {
    font-size: clamp(27px, 4.2vw, 40px); line-height: 1.3; text-align: center;
    letter-spacing: -.012em; margin: 8px 0 26px; word-break: break-word;
  }
  .quiz-prompt.jp { line-height: 1.45; letter-spacing: .01em; }
  .quiz-prompt.medium { font-size: clamp(19px, 2.7vw, 25px); line-height: 1.55; }
  .quiz-prompt.glyph { font-family: var(--serif); font-size: clamp(66px, 10vw, 96px); line-height: 1.1; margin-bottom: 18px; }
  .prompt-note { text-align: center; font-size: 12px; color: var(--muted); margin-top: -18px; margin-bottom: 22px; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .option {
    display: flex; align-items: center; gap: 11px;
    width: 100%; padding: 13px 14px;
    border: 1.5px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink);
    font-size: 14.5px; line-height: 1.45; text-align: left;
    cursor: pointer; transition: border-color .14s, background .14s, transform .1s;
    min-height: 54px;
  }
  .option:hover:not(:disabled) { border-color: var(--indigo); background: var(--indigo-soft); }
  .option:active:not(:disabled) { transform: scale(.995); }
  .option:disabled { cursor: default; }
  .option .key {
    width: 22px; height: 22px; flex: none; border-radius: 6px;
    border: 1px solid var(--line); background: var(--surface-2);
    display: grid; place-items: center;
    font-size: 10px; font-weight: 800; color: var(--muted);
  }
  .option .opt-text { flex: 1; word-break: break-word; }
  .option.jp .opt-text { font-size: 17px; }
  .option.kanji .opt-text { font-family: var(--serif); font-size: 24px; }
  .option.long .opt-text { font-size: 12.8px; line-height: 1.5; }
  .option.correct { border-color: var(--green); background: var(--green-soft); }
  .option.correct .key { border-color: var(--green); color: var(--green); }
  .option.wrong { border-color: var(--red); background: var(--red-soft); }
  .option.wrong .key { border-color: var(--red); color: var(--red); }
  .option.dim { opacity: .62; }

  .feedback {
    margin-top: 16px; padding: 16px 18px;
    border: 1px solid var(--line); border-radius: 14px;
    animation: rise .25s ease both;
  }
  .feedback.ok { background: var(--green-soft); border-color: rgba(47, 125, 91, .28); }
  .feedback.bad { background: var(--red-soft); border-color: rgba(183, 64, 47, .26); }
  .feedback-head { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .feedback-head b { font-family: var(--serif); font-size: 20px; }
  .feedback.ok .feedback-head b { color: var(--green); }
  .feedback.bad .feedback-head b { color: var(--red); }
  .feedback-body { font-size: 13px; line-height: 1.65; }
  .feedback-body .jp { font-size: 15px; }
  .feedback-foot { display: flex; justify-content: flex-end; margin-top: 12px; }
  .feedback .speak-btn { border-color: rgba(0, 0, 0, .08); }

  /* Flashcards */
  .flashcard { perspective: 1500px; width: 100%; min-height: 370px; cursor: pointer; border: 0; background: transparent; padding: 0; display: block; text-align: inherit; }
  .flash-inner { position: relative; width: 100%; min-height: 370px; transform-style: preserve-3d; transition: transform .52s cubic-bezier(.2, .7, .2, 1); }
  .flashcard.flipped .flash-inner { transform: rotateY(180deg); }
  .flash-face {
    position: absolute; inset: 0;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 10px; padding: 32px;
    border: 1px solid var(--line); border-radius: 22px;
    background: var(--surface); box-shadow: var(--shadow);
    overflow: auto;
  }
  .flash-face.back { transform: rotateY(180deg); background: linear-gradient(160deg, var(--surface), var(--surface-2)); }
  .flash-face { pointer-events: none; }
  .flashcard .flash-face.front { pointer-events: auto; }
  .flashcard.flipped .flash-face.front { pointer-events: none; }
  .flashcard.flipped .flash-face.back { pointer-events: auto; }
  .flash-main.small { font-size: clamp(20px, 3.2vw, 27px); line-height: 1.45; }
  .flash-label { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
  .flash-main { font-size: clamp(30px, 5.4vw, 46px); line-height: 1.35; letter-spacing: -.01em; word-break: break-word; }
  .flash-main.jp { letter-spacing: .01em; }
  .flash-sub { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .flash-hint { position: absolute; bottom: 16px; left: 0; right: 0; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); opacity: .8; }
  .flash-face .speak-btn { width: 40px; height: 40px; border-radius: 11px; }
  .flash-face .speak-btn svg { width: 18px; height: 18px; }
  .flash-details { font-size: 13px; color: var(--muted); line-height: 1.65; max-width: 54ch; }
  .flash-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .flash-controls .btn { padding: 14px; font-size: 14px; }
  .flash-controls .btn[disabled] { opacity: .45; }

  /* Results */
  .results { padding: 32px; text-align: center; }
  .score-ring {
    width: 132px; height: 132px; border-radius: 50%; margin: 4px auto 18px;
    display: grid; place-items: center;
    background: conic-gradient(var(--green) calc(var(--pct) * 1%), var(--bg-2) 0);
    position: relative;
  }
  .score-ring::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--surface); }
  .score-ring span { position: relative; font-family: var(--serif); font-size: 33px; letter-spacing: -.02em; }
  .results h2 { font-family: var(--serif); font-size: clamp(25px, 4vw, 34px); letter-spacing: -.015em; }
  .results .results-sub { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
  .result-stats { display: flex; justify-content: center; gap: 28px; margin: 22px 0; flex-wrap: wrap; }
  .result-stat b { display: block; font-family: var(--serif); font-size: 25px; line-height: 1.2; }
  .result-stat span { font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
  .result-actions { display: flex; justify-content: center; gap: 9px; flex-wrap: wrap; margin-top: 8px; }
  .missed { text-align: left; margin-top: 26px; border-top: 1px dashed var(--line); padding-top: 20px; }
  .missed h3 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .missed-list { display: grid; gap: 7px; }
  .missed-row { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: var(--surface-2); border-radius: 9px; font-size: 13.5px; }
  .missed-row .jp { font-size: 15px; }
  .missed-row .en { color: var(--muted); font-size: 12px; }
  .missed-row .spacer { flex: 1; }

  .empty {
    padding: 46px 24px; text-align: center;
    border: 1px dashed var(--line-strong); border-radius: 16px;
    background: var(--surface-2); color: var(--muted);
  }
  .empty .big { font-family: var(--serif); font-size: 36px; color: var(--ink); margin-bottom: 6px; }
  .empty p { font-size: 13px; }
  .empty .btn { margin-top: 14px; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(23, 20, 15, .5);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 22px; animation: fade .18s ease both;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: min(720px, 100%); max-height: min(86vh, 860px); overflow: auto;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; box-shadow: var(--shadow-lg);
    padding: 24px 26px 26px;
    animation: rise .24s ease both;
  }
  .modal-top { display: flex; align-items: flex-start; gap: 16px; }
  .kanji-hero {
    width: 92px; height: 92px; flex: none;
    display: grid; place-items: center;
    font-family: var(--serif); font-size: 54px; line-height: 1;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px;
  }
  .modal-top h2 { font-family: var(--serif); font-size: 26px; line-height: 1.2; letter-spacing: -.01em; }
  .modal-top .modal-sub { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
  .modal-close { margin-left: auto; }
  .modal-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .modal-section { margin-top: 22px; }
  .modal-section h3 {
    font-size: 10.5px; letter-spacing: .15em; text-transform: uppercase;
    color: var(--muted); font-weight: 800; margin-bottom: 8px;
  }
  .reading-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .reading-box { padding: 11px 13px; background: var(--surface-2); border-radius: 10px; }
  .reading-box .label { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 800; margin-bottom: 3px; }
  .reading-box .val { font-size: 16px; line-height: 1.5; }
  .reading-table { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .reading-row { display: grid; grid-template-columns: 1.1fr 1fr .8fr 1.3fr; gap: 10px; padding: 9px 11px; background: var(--surface); font-size: 12px; }
  .reading-row.head { background: var(--surface-2); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
  .reading-row .jp { font-size: 13.5px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }

  .modal-open { overflow: hidden; }

  /* ---------- Loading / error ---------- */
  .loading { display: grid; gap: 14px; max-width: 720px; margin: 60px auto; text-align: center; }
  .loading .spinner {
    width: 34px; height: 34px; margin: 0 auto 8px;
    border: 3px solid var(--line); border-top-color: var(--indigo);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading h2 { font-family: var(--serif); font-size: 24px; }
  .loading p { color: var(--muted); font-size: 13px; }
  .error-card { max-width: 640px; margin: 50px auto; padding: 30px; text-align: center; }
  .error-card h2 { font-family: var(--serif); font-size: 26px; margin-bottom: 8px; }
  .error-card p { color: var(--muted); font-size: 13.5px; line-height: 1.7; }
  .error-card code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: 12px; }
  .error-card .btn { margin-top: 16px; }

  /* ---------- Toasts ---------- */
  .toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 120; display: grid; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
  .toast {
    background: var(--ink); color: var(--bg);
    padding: 11px 15px; border-radius: 10px; font-size: 12.5px; font-weight: 600;
    box-shadow: var(--shadow-lg); text-align: center;
    animation: toastIn .22s ease both;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- Footer ---------- */
  .site-footer { border-top: 1px solid var(--line); background: var(--surface-2); }
  .footer-inner {
    max-width: 1120px; margin: 0 auto; padding: 20px 24px 28px;
    display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap;
    font-size: 11.5px; color: var(--muted);
  }
  .footer-inner strong { color: var(--ink); }
  .footer-actions { display: flex; align-items: center; gap: 16px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 960px) {
    .topbar-inner { flex-wrap: wrap; gap: 8px 12px; padding: 10px 18px; }
    .main-nav { order: 3; width: 100%; margin-left: 0; justify-content: space-between; overflow-x: auto; }
    .main-nav a { flex: 1; text-align: center; padding: 7px 8px; }
    .top-actions { margin-left: auto; }
    .wrap { padding: 26px 18px 68px; }
    .hero { grid-template-columns: 1fr; }
    .hero-art { min-height: 190px; }
    .hero-kanji { font-size: 92px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .deck-grid { grid-template-columns: 1fr; }
    .deck-card { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; }
    .deck-card .deck-top, .deck-card .deck-desc, .deck-card .deck-nums, .deck-card .bar { grid-column: 1; }
    .deck-card .deck-actions { grid-column: 2; grid-row: 1 / span 4; flex-direction: column; align-self: center; }
    .deck-card .bar { margin-top: 2px; }
    .how-card { grid-template-columns: 1fr; gap: 14px; }
    .setup-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 700px) {
    body { font-size: 15.5px; }
    .brand-sub { display: none; }
    .brand-title { font-size: 15px; }
    .brand-mark { width: 38px; height: 38px; font-size: 21px; border-radius: 11px; }
    .streak-pill { display: none !important; }
    .main-nav a { font-size: 12px; }
    .main-nav a[data-nav="home"] { display: none; }
    .hero-copy { padding: 30px 22px 26px; }
    .hero-copy::before { font-size: 110px; }
    .hero-title { font-size: 35px; }
    .stat-value { font-size: 25px; }
    .stat-card { padding: 14px; }
    .page-head h1 { font-size: 32px; }
    .head-stats { display: none; }
    .options { grid-template-columns: 1fr; }
    .quiz-card { padding: 22px 18px 20px; }
    .quiz-prompt { margin-bottom: 20px; }
    .pattern-card { padding: 18px 17px; }
    .vocab-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .vocab-card { padding: 11px 12px; }
    .vocab-jp { font-size: 18px; }
    .vocab-en { font-size: 11px; }
    .kanji-grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
    .kanji-tile { padding: 12px 12px 10px; }
    .kanji-glyph { font-size: 38px; }
    .kanji-mean { font-size: 10.5px; }
    .setup-card { padding: 18px; }
    .modal { padding: 20px 18px 22px; }
    .kanji-hero { width: 68px; height: 68px; font-size: 40px; }
    .modal-top h2 { font-size: 22px; }
    .reading-grid { grid-template-columns: 1fr; }
    .reading-row { grid-template-columns: 1fr 1fr; }
    .reading-row.head { display: none; }
    .reading-row > div:nth-child(4) { grid-column: 1 / -1; color: var(--muted); }
    .flash-card, .flash-inner, .flashcard { min-height: 330px; }
    .flash-face { padding: 22px 18px; }
    .results { padding: 24px 18px; }
    .deck-card { grid-template-columns: 1fr; }
    .deck-card .deck-actions { grid-column: 1; grid-row: auto; flex-direction: row; }
    .review-banner .btn { margin-left: 0; width: 100%; }
  }

  @media (max-width: 420px) {
    .vocab-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
    .main-nav { padding: 3px; }
    .main-nav a { padding: 6px 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>

        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.6 8.6 0 1 1 9.5 3.5a6.9 6.9 0 0 0 11 11Z"/></svg>

<main id="main" class="wrap" tabindex="-1">
  <div id="view">

      <button type="button" class="link-btn" data-action="reset">Reset progress</button>
    </div>

</footer>

<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

<noscript>
  <div style="max-width:640px;margin:40px auto;padding:24px;border:1px solid #ddd;border-radius:12px;font-family:sans-serif">
    This study app needs JavaScript enabled to load the vocabulary, kanji and grammar data.
  </div>
</noscript>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  Constants & state
   * ------------------------------------------------------------------ */

  var DAY = 86400000;
  var INTERVALS = { 1: 0, 2: 1, 3: 2, 4: 4, 5: 7 };
  var STORE_KEY = 'jp8-japanese-study-v1';
  var ROUTES = ['home', 'vocab', 'kanji', 'grammar', 'study'];

  var DECK_META = {
    vocab: {
      name: 'Vocabulary', jp: '単語', glyph: '単', tone: '',
      desc: 'Animals, activities, countries, food, family and everyday classroom language.'
    },
    kanji: {
      name: 'Kanji', jp: '漢字', glyph: '漢', tone: 'vermilion',
      desc: 'Every character in the course, with readings and the words it appears in.'
    },
    structures: {
      name: 'Grammar', jp: '文法', glyph: '文', tone: 'green',
      desc: 'Sentence and question patterns, verb forms and noun modification.'
    }
  };

  var TYPE_META = {
    sentence_pattern: { label: 'Sentence pattern', tone: 'badge-indigo' },
    question_pattern: { label: 'Question pattern', tone: 'badge-vermilion' },
    grammar_formation: { label: 'Grammar formation', tone: 'badge-green' },
    noun_modification: { label: 'Noun modification', tone: 'badge-gold' }
  };

  var ICON = {
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>',
    speak: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.2 9H3v6h3.2L11 19V5Z" fill="currentColor"/><path d="M15 8.7a4.6 4.6 0 0 1 0 6.6M17.7 5.9a8.4 8.4 0 0 1 0 12.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg>'
  };

  var state = {
    loaded: false,
    error: null,
    raw: {},
    items: { vocab: [], kanji: [], structures: [] },
    byId: new Map(),
    progress: {},
    activity: {},
    settings: { theme: null },
    route: '',
    session: null,
    modal: null,
    ui: {
      vocabQuery: '',
      vocabSort: 'en',
      kanjiQuery: '',
      kanjiFilter: 'all',
      structQuery: '',
      structCat: 'all',
      structType: 'all'
    },
    setup: {
      deck: 'vocab',
      mode: 'quiz',
      scope: 'smart',
      count: 10,
      direction: 'mixed'
    }
  };

  var storageOK = true;

  /* ------------------------------------------------------------------ *
   *  Small helpers
   * ------------------------------------------------------------------ */

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function hasJa(text) {
    return /[\u3040-\u30ff\u3400-\u9fff\uff66-\uff9f]/.test(String(text || ''));
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

  function percent(part, total) {
    if (!total) return 0;
    return Math.round((part / total) * 100);
  }

  function dateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function speakBtn(text, label) {
    if (!text) return '';
    return '<button type="button" class="icon-btn speak-btn" data-action="speak" data-speak="' +
      esc(text) + '" aria-label="' + esc(label || 'Play pronunciation') + '" title="' +
      esc(label || 'Play pronunciation') + '">' + ICON.speak + '</button>';
  }

  function statusOf(id) {
    var p = state.progress[id];
    if (!p) return 'new';
    return (p.b || 1) >= 4 ? 'mastered' : 'learning';
  }

  function statusLabel(status) {
    return status === 'mastered' ? 'Strong' : status === 'learning' ? 'Learning' : 'New';
  }

  function statusDot(status) {
    return '<span class="dot ' + status + '" aria-hidden="true"></span>';
  }

  function sourcesHtml(sources) {
    if (!sources || !sources.length) return '';
    return '<details class="sources"><summary>Sources · ' + sources.length + '</summary><ul>' +
      sources.map(function (src) {
        var pages = src.pages && src.pages.length ? ' <span class="dim">pp. ' + src.pages.join(', ') + '</span>' : '';
        return '<li>' + esc(src.document) + pages + '</li>';
      }).join('') + '</ul></details>';
  }

  /* ------------------------------------------------------------------ *
   *  Persistence
   * ------------------------------------------------------------------ */

  function loadStore() {
    try {
      var raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      if (raw.progress && typeof raw.progress === 'object') state.progress = raw.progress;
      if (raw.activity && typeof raw.activity === 'object') state.activity = raw.activity;
      if (raw.settings && typeof raw.settings === 'object') {
        state.settings = Object.assign(state.settings, raw.settings);
      }
    } catch (e) { /* storage blocked or corrupt — start fresh */ }

    try {
      localStorage.setItem('__jp8_test__', '1');
      localStorage.removeItem('__jp8_test__');
    } catch (e) {
      storageOK = false;
    }
  }

  function saveStore() {
    if (!storageOK) return;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        progress: state.progress,
        activity: state.activity,
        settings: state.settings
      }));
    } catch (e) {
      storageOK = false;
      updateStorageNote();
    }
  }

  function updateStorageNote() {
    var el = $('#storage-note');
    if (el && !storageOK) el.textContent = 'Progress cannot be saved in this browser';
  }

  /* ------------------------------------------------------------------ *
   *  Theme
   * ------------------------------------------------------------------ */

  function applyTheme() {
    var t = state.settings.theme;
    if (!t) {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#14161b' : '#f6f1e7');
    var btn = $('#theme-toggle');
    if (btn) btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  }

  function toggleTheme() {
    var current = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    state.settings.theme = current === 'dark' ? 'light' : 'dark';
    applyTheme();
    saveStore();
  }

  /* ------------------------------------------------------------------ *
   *  Data loading & normalisation
   * ------------------------------------------------------------------ */

  function fetchJSON(file) {
    return fetch(file, { cache: 'no-cache' }).then(function (res) {
      if (!res.ok) throw new Error(file + ' (HTTP ' + res.status + ')');
      return res.json();
    });
  }

  function loadData() {
    Promise.all([fetchJSON('vocab.json'), fetchJSON('kanji.json'), fetchJSON('structures.json')])
      .then(function (results) {
        state.raw = { vocab: results[0], kanji: results[1], structures: results[2] };
        if (!Array.isArray(results[0]) || !Array.isArray(results[1]) || !Array.isArray(results[2])) {
          throw new Error('One of the data files is not a JSON array.');
        }
        normalise();
        state.loaded = true;
        render();
      })
      .catch(function (err) {
        state.error = err;
        render();
      });
  }

  function normalise() {
    state.items.vocab = state.raw.vocab.map(function (entry) {
      var pairs = Object.keys(entry || {});
      if (!pairs.length) return null;
      var en = pairs[0];
      var jp = entry[en];
      if (typeof en !== 'string' || typeof jp !== 'string') return null;
      return { deck: 'vocab', id: 'v:' + en, en: en, jp: jp };
    }).filter(Boolean);

    state.items.kanji = state.raw.kanji.map(function (entry) {
      if (!entry || !entry.kanji) return null;
      var pron = entry.pronunciations || {};
      return {
        deck: 'kanji',
        id: 'k:' + entry.kanji,
        kanji: entry.kanji,
        meanings: Array.isArray(entry.meanings) ? entry.meanings : [],
        on: Array.isArray(pron.on_yomi) ? pron.on_yomi : [],
        kun: Array.isArray(pron.kun_yomi) ? pron.kun_yomi : [],
        entry: entry
      };
    }).filter(Boolean);

    state.items.structures = state.raw.structures.map(function (entry) {
      if (!entry || !entry.id) return null;
      return { deck: 'structures', id: 's:' + entry.id, entry: entry };
    }).filter(Boolean);

    state.byId = new Map();
    ['vocab', 'kanji', 'structures'].forEach(function (deck) {
      state.items[deck].forEach(function (item) { state.byId.set(item.id, item); });
    });
  }

  function allItems(deck) {
    if (deck === 'mixed') {
      return state.items.vocab.concat(state.items.kanji, state.items.structures);
    }
    return state.items[deck] || [];
  }

  function deckLabel(deck) {
    return deck === 'mixed' ? 'Everything' : (DECK_META[deck] ? DECK_META[deck].name : 'Study');
  }

  /* ------------------------------------------------------------------ *
   *  Progress & stats
   * ------------------------------------------------------------------ */

  function isDue(item) {
    var p = state.progress[item.id];
    if (!p) return false;
    var interval = INTERVALS[p.b || 1];
    if (interval == null) interval = 0;
    return Date.now() >= (p.t || 0) + interval * DAY;
  }

  function recordAnswer(id, correct) {
    var p = state.progress[id] || { b: 0, c: 0, w: 0, t: 0 };
    if (correct) {
      p.b = Math.min(5, (p.b || 0) + 1);
      p.c = (p.c || 0) + 1;
    } else {
      p.b = 1;
      p.w = (p.w || 0) + 1;
    }
    p.t = Date.now();
    state.progress[id] = p;
    var key = dateKey(new Date());
    state.activity[key] = (state.activity[key] || 0) + 1;
    saveStore();
    updateHeader();
  }

  function deckStats(deck) {
    var items = allItems(deck);
    var mastered = 0, learning = 0, seen = 0, due = 0, correct = 0, wrong = 0;
    items.forEach(function (item) {
      var p = state.progress[item.id];
      if (p) {
        seen++;
        correct += p.c || 0;
        wrong += p.w || 0;
        if ((p.b || 1) >= 4) mastered++; else learning++;
        if (isDue(item)) due++;
      }
    });
    return {
      total: items.length,
      mastered: mastered,
      learning: learning,
      seen: seen,
      fresh: items.length - seen,
      due: due,
      correct: correct,
      wrong: wrong,
      pct: percent(mastered, items.length)
    };
  }

  function streakCount() {
    var act = state.activity;
    var d = new Date();
    if (!act[dateKey(d)]) d.setDate(d.getDate() - 1);
    var n = 0;
    while (act[dateKey(d)] && n < 3650) {
      n++;
      d.setDate(d.getDate() - 1);
    }
    return n;
  }

  function updateHeader() {
    var pill = $('#streak-pill');
    if (!pill) return;
    var n = streakCount();
    if (n > 0) {
      pill.hidden = false;
      pill.textContent = n === 1 ? '1-day streak' : n + '-day streak';
    } else {
      pill.hidden = true;
      pill.textContent = '';
    }
  }

  /* ------------------------------------------------------------------ *
   *  Selection & question building
   * ------------------------------------------------------------------ */

  function previewCount(deck, scope) {
    var pool = allItems(deck);
    if (scope === 'new') {
      return pool.filter(function (it) { return !state.progress[it.id]; }).length;
    }
    if (scope === 'tricky') {
      return pool.filter(function (it) {
        var p = state.progress[it.id];
        return p && ((p.w || 0) > (p.c || 0) || (p.b || 1) <= 1);
      }).length;
    }
    if (scope === 'smart') {
      return pool.filter(function (it) { return !state.progress[it.id] || isDue(it); }).length;
    }
    return pool.length;
  }

  function pickItems(deck, scope, count) {
    var pool = allItems(deck);
    var n = count === 'all' || count == null ? pool.length : Number(count);
    n = Math.max(1, n);

    if (scope === 'new') {
      return shuffle(pool.filter(function (it) { return !state.progress[it.id]; })).slice(0, n);
    }

    if (scope === 'tricky') {
      return shuffle(pool.filter(function (it) {
        var p = state.progress[it.id];
        return p && ((p.w || 0) > (p.c || 0) || (p.b || 1) <= 1);
      })).slice(0, n);
    }

    if (scope === 'smart') {
      var due = shuffle(pool.filter(isDue)).slice(0, n);
      var fresh = shuffle(pool.filter(function (it) { return !state.progress[it.id]; }));
      var result = due.concat(fresh.slice(0, Math.max(0, n - due.length)));
      return result;
    }

    return shuffle(pool).slice(0, n);
  }

  function buildOptions(answer, pool, max) {
    max = max || 4;
    var out = [answer];
    var seen = {};
    seen[String(answer).trim().toLowerCase()] = true;
    var candidates = shuffle(pool);
    for (var i = 0; i < candidates.length && out.length < max; i++) {
      var candidate = candidates[i];
      if (candidate == null || candidate === '') continue;
      var key = String(candidate).trim().toLowerCase();
      if (seen[key]) continue;
      seen[key] = true;
      out.push(candidate);
    }
    return shuffle(out);
  }

  function buildQuestion(item, direction) {
    if (item.deck === 'vocab') return vocabQuestion(item, direction);
    if (item.deck === 'kanji') return kanjiQuestion(item);
    return structureQuestion(item);
  }

  function vocabQuestion(item, direction) {
    var dir = direction === 'mixed' ? (Math.random() < 0.5 ? 'en2jp' : 'jp2en') : (direction || 'en2jp');
    var answer = dir === 'en2jp' ? item.jp : item.en;
    var prompt = dir === 'en2jp' ? item.en : item.jp;
    var pool = state.items.vocab.filter(function (x) { return x.id !== item.id; })
      .map(function (x) { return dir === 'en2jp' ? x.jp : x.en; });
    var options = buildOptions(answer, pool);
    return {
      itemId: item.id,
      deck: 'vocab',
      label: dir === 'en2jp' ? 'English → 日本語' : '日本語 → English',
      prompt: prompt,
      promptJa: hasJa(prompt),
      promptClass: '',
      optionKanji: false,
      options: options,
      correctIndex: Math.max(0, options.indexOf(answer)),
      explainHtml: '<span class="jp">' + esc(item.jp) + '</span> <span class="muted">— ' + esc(item.en) + '</span>',
      speech: item.jp
    };
  }

  function kanjiQuestion(item) {
    var meaningStr = item.meanings.join(' / ');
    var roll = Math.random();

    if (roll < 0.45 || !item.on.length) {
      var poolMeanings = state.items.kanji.filter(function (x) { return x.id !== item.id; })
        .map(function (x) { return x.meanings.join(' / '); });
      var meanOptions = buildOptions(meaningStr, poolMeanings);
      return {
        itemId: item.id, deck: 'kanji', label: 'Kanji · meaning',
        prompt: item.kanji, promptJa: true, promptClass: 'glyph', optionKanji: false,
        options: meanOptions,
        correctIndex: Math.max(0, meanOptions.indexOf(meaningStr)),
        explainHtml: '<span class="jp serif" style="font-size:19px">' + esc(item.kanji) + '</span> <span class="muted">— ' + esc(meaningStr) + '</span><br><span class="muted">On: ' + esc(item.on.join('・') || '—') + ' · Kun: ' + esc(item.kun.join('・') || '—') + '</span>',
        speech: item.kanji
      };
    }

    if (roll < 0.74) {
      var poolKanji = state.items.kanji.filter(function (x) { return x.id !== item.id; })
        .map(function (x) { return x.kanji; });
      var kanjiOptions = buildOptions(item.kanji, poolKanji);
      return {
        itemId: item.id, deck: 'kanji', label: 'Meaning · kanji',
        prompt: meaningStr, promptJa: false, promptClass: 'medium', optionKanji: true,
        options: kanjiOptions,
        correctIndex: Math.max(0, kanjiOptions.indexOf(item.kanji)),
        explainHtml: '<span class="jp serif" style="font-size:19px">' + esc(item.kanji) + '</span> <span class="muted">— ' + esc(meaningStr) + '</span><br><span class="muted">On: ' + esc(item.on.join('・') || '—') + ' · Kun: ' + esc(item.kun.join('・') || '—') + '</span>',
        speech: item.kanji
      };
    }

    var answer = item.on[0];
    var poolReadings = state.items.kanji.filter(function (x) { return x.id !== item.id && x.on.length; })
      .map(function (x) { return x.on[0]; });
    var readingOptions = buildOptions(answer, poolReadings);
    return {
      itemId: item.id, deck: 'kanji', label: 'Kanji · on-yomi',
      prompt: item.kanji, promptJa: true, promptClass: 'glyph', optionKanji: false,
      options: readingOptions,
      correctIndex: Math.max(0, readingOptions.indexOf(answer)),
      explainHtml: '<span class="jp serif" style="font-size:19px">' + esc(item.kanji) + '</span> <span class="muted">— ' + esc(meaningStr) + '</span><br><span class="muted">On: ' + esc(item.on.join('・') || '—') + ' · Kun: ' + esc(item.kun.join('・') || '—') + '</span>',
      speech: item.kanji
    };
  }

  function structureQuestion(item) {
    var s = item.entry;
    var pattern = s.pattern || '';
    var english = s.english_template || s.name || '';
    var sharedEnglish = state.items.structures.filter(function (x) {
      return (x.entry.english_template || x.entry.name) === english;
    }).length > 1;
    var patternFirst = sharedEnglish ? true : Math.random() < 0.5;
    var example = s.example;
    var explain = '<strong>' + esc(s.name) + '</strong><br><span class="muted">' + esc(s.formation || '') + '</span>';
    if (example && example.japanese) {
      explain += '<div class="jp" style="margin-top:6px;font-size:15px">' + esc(example.japanese) +
        ' <span class="muted" style="font-size:12.5px">— ' + esc(example.english) + '</span></div>';
    }

    if (patternFirst) {
      var poolEnglish = state.items.structures.filter(function (x) { return x.id !== item.id; })
        .map(function (x) { return x.entry.english_template || x.entry.name; });
      var englishOptions = buildOptions(english, poolEnglish);
      return {
        itemId: item.id, deck: 'structures', label: 'Pattern · meaning',
        prompt: pattern, promptJa: hasJa(pattern), promptClass: 'medium', optionKanji: false,
        options: englishOptions,
        correctIndex: Math.max(0, englishOptions.indexOf(english)),
        explainHtml: explain,
        speech: null
      };
    }

    var poolPatterns = state.items.structures.filter(function (x) { return x.id !== item.id; })
      .map(function (x) { return x.entry.pattern; });
    var patternOptions = buildOptions(pattern, poolPatterns);
    return {
      itemId: item.id, deck: 'structures', label: 'Meaning · pattern',
      prompt: english, promptJa: false, promptClass: 'medium', optionKanji: false,
      options: patternOptions,
      correctIndex: Math.max(0, patternOptions.indexOf(pattern)),
      explainHtml: explain,
      speech: null
    };
  }

  /* ------------------------------------------------------------------ *
   *  Session lifecycle
   * ------------------------------------------------------------------ */

  function startSession(opts) {
    opts = opts || {};
    var mode = opts.mode || 'quiz';
    var deck = opts.deck || 'vocab';
    var direction = opts.direction || state.setup.direction;
    var items = opts.items ? opts.items.slice() : pickItems(deck, opts.scope || 'smart', opts.count);

    if (!items.length) {
      toast('Nothing in that queue yet — try “All cards”.');
      return;
    }

    if (mode === 'flash' && direction === 'mixed') {
      direction = Math.random() < 0.5 ? 'en2jp' : 'jp2en';
    }

    var label = opts.label || (deckLabel(deck) + (mode === 'quiz' ? ' quiz' : ' flashcards'));

    if (mode === 'quiz') {
      state.session = {
        mode: 'quiz',
        label: label,
        items: items,
        questions: items.map(function (it) { return buildQuestion(it, direction); }),
        idx: 0,
        answered: null,
        correctCount: 0,
        results: [],
        finished: false,
        config: { mode: 'quiz', deck: deck, direction: direction, items: items.slice(), label: label }
      };
    } else {
      state.session = {
        mode: 'flash',
        label: label,
        items: items,
        index: 0,
        flipped: false,
        correctCount: 0,
        results: [],
        finished: false,
        config: { mode: 'flash', deck: deck, direction: direction, items: items.slice(), label: label }
      };
    }

    if (currentRoute() !== 'study') {
      location.hash = '#study';
    } else {
      render();
    }
    scrollSessionTop();
  }

  function scrollSessionTop() {
    if (window.scrollY > 80) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function answerQuestion(index) {
    var s = state.session;
    if (!s || s.mode !== 'quiz' || s.finished || s.answered !== null) return;
    var q = s.questions[s.idx];
    if (index < 0 || index >= q.options.length) return;
    var ok = index === q.correctIndex;
    s.answered = index;
    if (ok) s.correctCount++;
    s.results.push({ itemId: q.itemId, correct: ok, item: state.byId.get(q.itemId) });
    recordAnswer(q.itemId, ok);
    render();
  }

  function nextQuestion() {
    var s = state.session;
    if (!s || s.mode !== 'quiz' || s.answered === null) return;
    if (s.idx >= s.questions.length - 1) {
      s.finished = true;
    } else {
      s.idx++;
      s.answered = null;
    }
    render();
    scrollSessionTop();
  }

  function toggleFlash() {
    var s = state.session;
    if (!s || s.mode !== 'flash' || s.finished) return;
    s.flipped = !s.flipped;
    var card = $('.flashcard');
    if (card) {
      card.classList.toggle('flipped', s.flipped);
      card.setAttribute('aria-pressed', String(s.flipped));
    }
    $all('[data-action="grade"]').forEach(function (btn) { btn.disabled = !s.flipped; });
  }

  function gradeFlash(grade) {
    var s = state.session;
    if (!s || s.mode !== 'flash' || s.finished || !s.flipped) return;
    var item = s.items[s.index];
    if (!item) return;
    var ok = grade === 1;
    recordAnswer(item.id, ok);
    s.results.push({ itemId: item.id, correct: ok, item: item });
    if (ok) s.correctCount++;
    if (s.index >= s.items.length - 1) {
      s.finished = true;
    } else {
      s.index++;
      s.flipped = false;
    }
    render();
    scrollSessionTop();
  }

  function restartSession() {
    var s = state.session;
    if (!s) return;
    startSession({
      mode: s.config.mode,
      deck: s.config.deck,
      direction: s.config.direction,
      items: s.config.items,
      label: s.config.label
    });
  }

  function reviewMissed() {
    var s = state.session;
    if (!s) return;
    var items = s.results.filter(function (r) { return !r.correct; })
      .map(function (r) { return state.byId.get(r.itemId); })
      .filter(Boolean);
    if (!items.length) { toast('No missed cards to review.'); return; }
    startSession({
      mode: 'flash',
      deck: s.config.deck,
      direction: s.config.direction,
      items: items,
      label: 'Review mistakes'
    });
  }

  function endSession() {
    state.session = null;
    render();
  }

    var sort = state.ui.vocabSort;
    if (sort === 'jp') {
      list.sort(function (a, b) { return a.jp.localeCompare(b.jp, 'ja'); });
    } else if (sort === 'status') {

        return d !== 0 ? d : a.en.localeCompare(b.en);

    }
